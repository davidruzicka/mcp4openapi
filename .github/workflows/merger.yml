name: Merger

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback window in hours for recently updated PRs
        required: false
        default: '72'
      max_prs:
        description: Maximum number of PRs to evaluate in a single run
        required: false
        default: '10'
      lease_ttl_minutes:
        description: Reviewer lease TTL in minutes for in-progress review detection
        required: false
        default: '45'
      agent_id:
        description: Agent identity to write into metadata
        required: false
        default: merger

concurrency:
  group: merger
  cancel-in-progress: false

jobs:
  merger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Evaluate merge gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGER_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '72' }}
          MERGER_MAX_PRS: ${{ github.event.inputs.max_prs || '10' }}
          REVIEWER_LEASE_TTL_MINUTES: ${{ github.event.inputs.lease_ttl_minutes || '45' }}
          MERGER_AGENT_ID: ${{ github.event.inputs.agent_id || 'merger' }}
        run: npm run agent:merger
