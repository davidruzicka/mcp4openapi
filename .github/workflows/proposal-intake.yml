name: Proposal Intake

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback window in hours for recently updated issues
        required: false
        default: '72'
      max_candidates:
        description: Maximum number of recent proposals to load and duplicate candidates to rank per proposal. Does not increase side effects per run.
        required: false
        default: '10'
      agent_id:
        description: Agent identity to write into metadata
        required: false
        default: proposal-intake

concurrency:
  group: proposal-intake
  cancel-in-progress: false

jobs:
  proposal-intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run proposal intake duplicate gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSAL_INTAKE_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '72' }}
          PROPOSAL_INTAKE_MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '10' }}
          PROPOSAL_INTAKE_AGENT_ID: ${{ github.event.inputs.agent_id || 'proposal-intake' }}
        run: npm run agent:proposal-intake
