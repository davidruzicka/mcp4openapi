name: MCP Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  mcp-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MCP Sentinel
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64)
              asset="mcp-sentinel-linux-x86_64"
              ;;
            aarch64|arm64)
              asset="mcp-sentinel-linux-arm64"
              ;;
            *)
              echo "Unsupported runner architecture: $arch" >&2
              exit 1
              ;;
          esac
          curl -fsSL \
            -o mcp-sentinel \
            "https://github.com/beejak/MCP_Scanner/releases/download/v2.6.0/${asset}"
          chmod +x mcp-sentinel

      - name: Run MCP Sentinel scan
        run: |
          ./mcp-sentinel \
            scan "${{ github.workspace }}" \
            --output sarif \
            --output-file "${{ github.workspace }}/mcp-scan.sarif" \
            --fail-on high

      - name: Upload SARIF
        if: ${{ always() && hashFiles('mcp-scan.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcp-scan.sarif
