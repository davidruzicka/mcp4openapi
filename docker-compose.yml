version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp4openapi:latest
    container_name: mcp4openapi
    # Security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
    ports:
      - "3003:3003"
    volumes:
      # Mount your profiles directory
      - ./profiles:/app/profiles:ro
    environment:
      # Required
      - MCP4_OPENAPI_SPEC_PATH=/app/profiles/gitlab/openapi.yaml
      - MCP4_PROFILE_PATH=/app/profiles/gitlab/developer-profile-oauth.json
      - MCP4_API_TOKEN=${MCP4_API_TOKEN}
      - MCP4_API_BASE_URL=${MCP4_API_BASE_URL:-https://gitlab.com/api/v4}
      
      # Transport
      - MCP4_TRANSPORT=http
      - MCP4_HOST=0.0.0.0
      - MCP4_PORT=3003
      
      # Logging
      - MCP4_LOG_LEVEL=${MCP4_LOG_LEVEL:-info}
      - MCP4_LOG_FORMAT=${MCP4_LOG_FORMAT:-json}
      
      # HTTP Transport (optional)
      - MCP4_ALLOWED_ORIGINS=${MCP4_ALLOWED_ORIGINS:-http://localhost:*}
      - MCP4_SESSION_TIMEOUT_MS=${MCP4_SESSION_TIMEOUT_MS:-1800000}
      - MCP4_HEARTBEAT_ENABLED=${MCP4_HEARTBEAT_ENABLED:-false}
      - MCP4_HEARTBEAT_INTERVAL_MS=${MCP4_HEARTBEAT_INTERVAL_MS:-30000}
      
      # Metrics (optional)
      - MCP4_METRICS_ENABLED=${MCP4_METRICS_ENABLED:-false}
      - MCP4_METRICS_PATH=${MCP4_METRICS_PATH:-/metrics}
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  default:
    name: mcp-network

