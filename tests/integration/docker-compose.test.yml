services:
  mcp-server:
    build: 
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - MCP4_TRANSPORT=http
      - MCP4_PORT=3003
      - MCP4_HOST=0.0.0.0
      - MCP4_OPENAPI_SPEC_PATH=tests/integration/openapi.yaml
      - MCP4_PROFILE_PATH=tests/integration/test-profile.json
      # OAuth issuer URL for endpoint discovery
      - MCP4_OAUTH_ISSUER=http://mock-oauth:4000
      - MCP4_OAUTH_CLIENT_ID=test-client
      - MCP4_OAUTH_CLIENT_SECRET=test-secret
      # URL for client (browser/test runner) to be redirected back to
      - MCP4_OAUTH_REDIRECT_URI=http://mcp-server:3003/oauth/callback
      - MCP4_API_BASE_URL=http://mock-oauth:4000
      - LOG_LEVEL=debug
    volumes:
      - ../../tests/integration:/app/tests/integration
    depends_on:
      - mock-oauth

  mock-oauth:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./mock-oauth-server.js:/app/server.js
    command: ["node", "server.js"]
    ports:
      - "4000:4000"

  test-runner:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./run_test.js:/app/run_test.js
    command: ["node", "/app/run_test.js"]
    depends_on:
      - mcp-server
      - mock-oauth
    environment:
      - MCP_SERVER_URL=http://mcp-server:3003
      - MOCK_OAUTH_URL=http://mock-oauth:4000

