          schema:
            type: string
        - name: until
          in: query
          description: Only commits before this date in ISO 8601 format
          schema:
            type: string
        - name: all
          in: query
          description: Return all commits, including those not in the default branch
          schema:
            type: boolean
        - name: with_stats
