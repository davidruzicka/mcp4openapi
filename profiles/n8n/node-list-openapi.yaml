openapi: 3.0.0
info:
  title: n8n Nodes Metadata API
  description: n8n nodes metadata endpoint
  version: 1.0.0
servers:
  - url: /
paths:
  /types/nodes.json:
    get:
      operationId: getNodes
      summary: Retrieve n8n node definitions
      description: Returns the full list of known n8n nodes and their metadata.
      responses:
        "200":
          description: Operation successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
components: {}
