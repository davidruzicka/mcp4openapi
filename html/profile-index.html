                <button
                  class="tab${tab.key === activeAuth ? ' active' : ''}"
                  id="auth-tab-${escapeHtml(tab.key)}"
                  data-auth="${escapeHtml(tab.key)}"
                  role="tab"
                  aria-selected="${tab.key === activeAuth ? 'true' : 'false'}"
                  tabindex="${tab.key === activeAuth ? '0' : '-1'}"
                >
                  ${escapeHtml(tab.label)}
                </button>
              `).join('')}
            </div>
            <div class="snippet-section-header">
              <span class="snippet-section-title">${escapeHtml(snippetSectionLabel)}</span>
              <span class="mode-badge" id="active-mode-badge">${escapeHtml(getModeLabel(activeMode))}</span>
            </div>
            <div class="snippets" id="snippet-list" role="tabpanel" aria-live="polite">
              ${renderSnippets(profile, activeAuth, activeMode, initialTenantId)}
            </div>
          </div>
        `;

        wireCollapsibleDetails(detailEl, `profile-${profile.profileId}`);

        const modeRow = detailEl.querySelector('#mode-tabs');
        const authLabel = detailEl.querySelector('#auth-label');
        const apiEndpointEnvLabel = detailEl.querySelector('#api-endpoint-env-label');
        const tabRow = detailEl.querySelector('#auth-tabs');
        const modeBadge = detailEl.querySelector('#active-mode-badge');
        const snippetList = detailEl.querySelector('#snippet-list');
        const tenantRow = detailEl.querySelector('#tenant-tabs');
        const toolHeaderPreview = detailEl.querySelector('#tool-header-preview');
        const paramHeaderPreview = detailEl.querySelector('#param-header-preview');
        if (modeRow && authLabel && tabRow && snippetList) {
          let currentMode = activeMode;
          let currentTenantId = initialTenantId;
          let currentAuthKey = activeAuth;

          const wireTextFilter = (inputSelector, itemSelector, emptySelector) => {
            const input = detailEl.querySelector(inputSelector);
            if (!(input instanceof HTMLInputElement)) return;
            const scopeRoot = input.closest('.filter-card-body') || detailEl;
            const emptyState = scopeRoot.querySelector(emptySelector);
            const applyFilter = () => {
              const query = normalizeFilterQuery(input.value);
              let visibleCount = 0;
              scopeRoot.querySelectorAll(itemSelector).forEach(item => {
                if (!(item instanceof HTMLElement)) return;
                const filterText = normalizeFilterQuery(item.getAttribute('data-filter-text') || item.textContent || '');
                const isVisible = !query || filterText.includes(query);
                item.toggleAttribute('hidden', !isVisible);
                if (isVisible) {
                  visibleCount += 1;
                }
              });
              if (emptyState instanceof HTMLElement) {
                emptyState.toggleAttribute('hidden', visibleCount !== 0);
              }
            };
            if (input.dataset.filterValueHooked !== '1') {
              const inputPrototype = Object.getPrototypeOf(input);
              const valueDescriptor = Object.getOwnPropertyDescriptor(inputPrototype, 'value');
              if (valueDescriptor && typeof valueDescriptor.get === 'function' && typeof valueDescriptor.set === 'function') {
                const nativeGet = valueDescriptor.get.bind(input);
                const nativeSet = valueDescriptor.set.bind(input);
                Object.defineProperty(input, 'value', {
                  configurable: true,
                  enumerable: valueDescriptor.enumerable ?? true,
                  get() {
                    return nativeGet();
                  },
                  set(nextValue) {
                    nativeSet(nextValue);
                    applyFilter();
                  },
                });
                input.dataset.filterValueHooked = '1';
              }
            }
            input.addEventListener('input', applyFilter);
            input.addEventListener('change', applyFilter);
            input.addEventListener('search', applyFilter);
            applyFilter();
          };

          const refreshSnippetAndPreview = () => {
            const activeTab = tabRow.querySelector('.tab.active') || tabRow.querySelector('.tab');
            currentAuthKey = activeTab?.getAttribute('data-auth') || currentAuthKey;
            updatePreviewText(toolHeaderPreview, 'X-Mcp4-Tools', serializeToolFilterHeader(profile.profileId));
            updatePreviewText(paramHeaderPreview, 'X-Mcp4-Params', serializeParamFilterHeader(profile.profileId));
            snippetList.innerHTML = renderSnippets(profile, currentAuthKey, currentMode, currentTenantId);
            wireClientTabs(snippetList);
            wireSnippetFormatTabs(snippetList);
          };

          const setActiveMode = modeKey => {
            currentMode = modeKey;
            modeRow.querySelectorAll('.tab').forEach(tab => {
              const isActive = tab.getAttribute('data-mode') === modeKey;
              tab.classList.toggle('active', isActive);
              tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
              tab.setAttribute('tabindex', isActive ? '0' : '-1');
            });
            const showAuthTabs = modeKey !== 'local';
            const showAuthLabel = modeKey === 'local';
            tabRow.toggleAttribute('hidden', !showAuthTabs);
            authLabel.toggleAttribute('hidden', !showAuthLabel);
            if (modeBadge instanceof HTMLElement) {
              modeBadge.textContent = getModeLabel(modeKey);
            }
            if (apiEndpointEnvLabel) {
              const showApiEndpointEnvLabel = modeKey === 'local' && !!apiEndpointEnvText;
              apiEndpointEnvLabel.toggleAttribute('hidden', !showApiEndpointEnvLabel);
            }
            refreshSnippetAndPreview();
          };

          const setActiveTab = authKey => {
            let activeTabId = null;
            tabRow.querySelectorAll('.tab').forEach(tab => {
              const isActive = tab.getAttribute('data-auth') === authKey;
              tab.classList.toggle('active', isActive);
              tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
              tab.setAttribute('tabindex', isActive ? '0' : '-1');
              if (isActive) {
                  activeTabId = tab.id || null;
                }
              });
            currentAuthKey = authKey;
            refreshSnippetAndPreview();
            if (activeTabId) {
              snippetList.setAttribute('aria-labelledby', activeTabId);
            } else {
              snippetList.removeAttribute('aria-labelledby');
            }
          };

          const setActiveTenant = tenantId => {
            currentTenantId = tenantId;
            tenantSelectionByProfile.set(profile.profileId, tenantId);
            if (tenantRow) {
              tenantRow.querySelectorAll('[data-tenant-id]').forEach(tab => {
                const isActive = tab.getAttribute('data-tenant-id') === tenantId;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
                tab.setAttribute('tabindex', isActive ? '0' : '-1');
              });
            }
            refreshSnippetAndPreview();
          };

          modeRow.addEventListener('click', event => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const modeKey = target.getAttribute('data-mode');
            if (!modeKey) return;
            setActiveMode(modeKey);
          });

          modeRow.addEventListener('keydown', event => {
            const tabs = Array.from(modeRow.querySelectorAll('[role="tab"]'));
            if (tabs.length === 0) return;

            const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
            if (currentIndex === -1) return;

            const focusModeTabAt = index => {
              const nextTab = tabs[index];
              if (!nextTab) return;
              nextTab.focus();
              const modeKey = nextTab.getAttribute('data-mode');
              if (modeKey) setActiveMode(modeKey);
            };

            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
              event.preventDefault();
              focusModeTabAt((currentIndex + 1) % tabs.length);
              return;
            }
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
              event.preventDefault();
              focusModeTabAt((currentIndex - 1 + tabs.length) % tabs.length);
              return;
            }
            if (event.key === 'Home') {
              event.preventDefault();
              focusModeTabAt(0);
              return;
            }
            if (event.key === 'End') {
              event.preventDefault();
              focusModeTabAt(tabs.length - 1);
            }
          });

          tabRow.addEventListener('click', event => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const authKey = target.getAttribute('data-auth');
            if (!authKey) return;
            setActiveTab(authKey);
          });

          tabRow.addEventListener('keydown', event => {
            const tabs = Array.from(tabRow.querySelectorAll('[role="tab"]'));
            if (tabs.length === 0) return;

            const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
            if (currentIndex === -1) return;

            const focusTabAt = index => {
              const nextTab = tabs[index];
              if (!nextTab) return;
              nextTab.focus();
              const authKey = nextTab.getAttribute('data-auth');
              if (authKey) setActiveTab(authKey);
            };

            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
              event.preventDefault();
              focusTabAt((currentIndex + 1) % tabs.length);
              return;
            }
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
              event.preventDefault();
              focusTabAt((currentIndex - 1 + tabs.length) % tabs.length);
              return;
            }
            if (event.key === 'Home') {
              event.preventDefault();
              focusTabAt(0);
              return;
            }
            if (event.key === 'End') {
              event.preventDefault();
              focusTabAt(tabs.length - 1);
            }
          });

          if (tenantRow) {
            tenantRow.addEventListener('click', event => {
              const target = event.target;
              if (!(target instanceof HTMLElement)) return;
              const tenantButton = target.closest('[data-tenant-id]');
              if (!(tenantButton instanceof HTMLElement)) return;
              const tenantId = tenantButton.getAttribute('data-tenant-id');
              if (!tenantId) return;
              setActiveTenant(tenantId);
            });

            tenantRow.addEventListener('keydown', event => {
              const tabs = Array.from(tenantRow.querySelectorAll('[role="tab"]'));
              if (tabs.length === 0) return;

              const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
              if (currentIndex === -1) return;

              const focusTabAt = index => {
                const nextTab = tabs[index];
                if (!nextTab) return;
                nextTab.focus();
                const tenantId = nextTab.getAttribute('data-tenant-id');
                if (tenantId) setActiveTenant(tenantId);
              };

              if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                event.preventDefault();
                focusTabAt((currentIndex + 1) % tabs.length);
                return;
              }
              if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                event.preventDefault();
                focusTabAt((currentIndex - 1 + tabs.length) % tabs.length);
                return;
              }
              if (event.key === 'Home') {
                event.preventDefault();
                focusTabAt(0);
                return;
              }
              if (event.key === 'End') {
                event.preventDefault();
                focusTabAt(tabs.length - 1);
              }
            });
          }

          detailEl.querySelectorAll('[data-tool-toggle]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const toolName = target.getAttribute('data-tool-toggle');
              if (!toolName) return;
              const selection = getToolSelection(profile.profileId);
              if (target.checked) {
                selection.exactNames.add(toolName);
              } else {
                selection.exactNames.delete(toolName);
              }
              syncSectionBulkToggles(detailEl, profile);
              refreshSnippetAndPreview();
            });
          });

          detailEl.querySelectorAll('[data-tool-control]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const controlKey = target.getAttribute('data-tool-control');
              if (!controlKey) return;
              const selection = getToolSelection(profile.profileId);
              if (target.checked) {
                selection.controlKeys.add(controlKey);
              } else {
                selection.controlKeys.delete(controlKey);
              }
              syncSectionBulkToggles(detailEl, profile);
              refreshSnippetAndPreview();
            });
          });

          detailEl.querySelectorAll('[data-param-toggle]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const paramName = target.getAttribute('data-param-toggle');
              if (!paramName) return;
              const valuesInput = detailEl.querySelector(`[data-param-values="${CSS.escape(paramName)}"]`);
              if (valuesInput instanceof HTMLInputElement) {
                valuesInput.disabled = !target.checked;
              }
              const selection = getParamSelection(profile.profileId);
              if (target.checked) {
                if (!selection.values.has(paramName)) {
                  const seeded = valuesInput instanceof HTMLInputElement
                    ? valuesInput.value.split(',').map(value => value.trim()).filter(Boolean)
                    : [];
                  selection.values.set(paramName, seeded);
                }
              } else {
                selection.values.delete(paramName);
              }
              syncSectionBulkToggles(detailEl, profile);
              refreshSnippetAndPreview();
            });
          });

          detailEl.querySelectorAll('[data-param-values]').forEach(input => {
            input.addEventListener('input', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement) || target.disabled) return;
              const paramName = target.getAttribute('data-param-values');
              if (!paramName) return;
              const selection = getParamSelection(profile.profileId);
              selection.values.set(
                paramName,
                target.value.split(',').map(value => value.trim()).filter(Boolean)
              );
              syncSectionBulkToggles(detailEl, profile);
              refreshSnippetAndPreview();
            });
          });

          detailEl.querySelectorAll('[data-param-control]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const controlKey = target.getAttribute('data-param-control');
              if (!controlKey) return;
              const selection = getParamSelection(profile.profileId);
              if (target.checked) {
                selection.controlKeys.add(controlKey);
              } else {
                selection.controlKeys.delete(controlKey);
              }
              syncSectionBulkToggles(detailEl, profile);
              refreshSnippetAndPreview();
            });
          });

          const setAllToolFilters = shouldSelect => {
            const selection = getToolSelection(profile.profileId);
            if (shouldSelect) {
              selection.exactNames = new Set(
                (Array.isArray(profile.toolCatalog) ? profile.toolCatalog : [])
                  .map(tool => tool?.name)
                  .filter(Boolean)
              );
            } else {
              selection.exactNames.clear();
            }
            detailEl.querySelectorAll('[data-tool-toggle]').forEach(input => {
              if (input instanceof HTMLInputElement) {
                input.checked = shouldSelect;
              }
            });
            syncSectionBulkToggles(detailEl, profile);
            refreshSnippetAndPreview();
          };

          const setAllParamFilters = shouldSelect => {
            const selection = getParamSelection(profile.profileId);
            if (!shouldSelect) {
              selection.values.clear();
            }

            detailEl.querySelectorAll('[data-param-toggle]').forEach(input => {
              if (!(input instanceof HTMLInputElement)) return;
              const paramName = input.getAttribute('data-param-toggle');
              input.checked = shouldSelect;
              if (!paramName) return;
              const valuesInput = detailEl.querySelector(`[data-param-values="${CSS.escape(paramName)}"]`);
              if (valuesInput instanceof HTMLInputElement) {
                valuesInput.disabled = !shouldSelect;
              }
              if (shouldSelect) {
                const seeded = valuesInput instanceof HTMLInputElement
                  ? valuesInput.value.split(',').map(value => value.trim()).filter(Boolean)
                  : [];
                selection.values.set(paramName, seeded);
              }
            });

            syncSectionBulkToggles(detailEl, profile);
            refreshSnippetAndPreview();
          };

          detailEl.querySelectorAll('[data-tool-section-toggle]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const shouldSelect = target.dataset.bulkState === 'none';
              setAllToolFilters(shouldSelect);
            });
          });

          detailEl.querySelectorAll('[data-param-section-toggle]').forEach(input => {
            input.addEventListener('change', event => {
              const target = event.target;
              if (!(target instanceof HTMLInputElement)) return;
              const shouldSelect = target.dataset.bulkState === 'none';
              setAllParamFilters(shouldSelect);
            });
          });

          wireTextFilter('[data-tool-search]', '[data-tool-filter-item]', '[data-tool-filter-empty]');
          wireTextFilter('[data-param-search]', '[data-param-filter-item]', '[data-param-filter-empty]');

          const initialActiveTab = tabRow.querySelector('.tab.active');
          if (initialActiveTab && initialActiveTab.id) {
            snippetList.setAttribute('aria-labelledby', initialActiveTab.id);
          }
          updatePreviewText(toolHeaderPreview, 'X-Mcp4-Tools', serializeToolFilterHeader(profile.profileId));
          updatePreviewText(paramHeaderPreview, 'X-Mcp4-Params', serializeParamFilterHeader(profile.profileId));
          syncSectionBulkToggles(detailEl, profile);
          setActiveMode(currentMode);
        }
      }

      function renderList(activeId, options) {
        const opts = options || {};
        listEl.innerHTML = '';
        profileData.forEach(profile => {
          const title = buildProfileTitle(profile);
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'profile-item' + (profile.profileId === activeId ? ' active' : '');
          item.setAttribute('role', 'option');
          item.setAttribute('aria-selected', profile.profileId === activeId ? 'true' : 'false');
          item.setAttribute('tabindex', profile.profileId === activeId ? '0' : '-1');
          item.setAttribute('data-profile-id', profile.profileId);
          item.id = `profile-option-${profile.profileId}`;
          item.innerHTML = `
            <div class="profile-title">${escapeHtml(title)}</div>
            <div class="profile-subtitle">${escapeHtml(profile.description || i18n.noDescription || '')}</div>
          `;
          item.addEventListener('click', () => {
            selectProfile(profile.profileId, { focusListItem: true });
          });
          listEl.appendChild(item);
        });

        if (opts.focusSelected) {
          const selected = Array.from(listEl.querySelectorAll('[data-profile-id]'))
            .find(node => node.getAttribute('data-profile-id') === activeId);
          if (selected instanceof HTMLElement) {
            selected.focus();
          }
        }
      }

      function selectProfile(profileId, options) {
        const profile = profileData.find(item => item.profileId === profileId);
        if (!profile) return;
        const newHash = '#' + profileId;
        if (location.hash !== newHash) {
          history.replaceState(null, '', newHash);
        }
        renderList(profileId, { focusSelected: !!(options && options.focusListItem) });
        renderDetail(profile);
      }

      if (profileData.length > 0) {
        const hashId = location.hash ? location.hash.slice(1) : '';
        const initial = profileData.find(p => p.profileId === hashId) || profileData[0];
        selectProfile(initial.profileId);
        document.getElementById(`profile-option-${initial.profileId}`)?.scrollIntoView({ block: 'nearest' });

        window.addEventListener('hashchange', () => {
          const id = location.hash ? location.hash.slice(1) : '';
          const profile = profileData.find(p => p.profileId === id);
          if (profile) {
            selectProfile(profile.profileId);
            document.getElementById(`profile-option-${profile.profileId}`)?.scrollIntoView({ block: 'nearest' });
          }
        });
      } else {
        detailEl.innerHTML = `<div class="notice">${escapeHtml(i18n.noProfiles || '')}</div>`;
      }

      document.addEventListener('click', event => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.matches('[data-copy]')) return;
        const text = target.getAttribute('data-copy');
        if (!text) return;
        const decoded = decodeURIComponent(text);
        navigator.clipboard?.writeText(decoded).then(() => {
          target.textContent = i18n.copied || '';
          setTimeout(() => { target.textContent = i18n.copy || ''; }, 1200);
        }).catch(() => {
          target.textContent = i18n.copyFailed || '';
          setTimeout(() => { target.textContent = i18n.copy || ''; }, 1200);
        });
      });

      listEl.addEventListener('keydown', event => {
        const options = Array.from(listEl.querySelectorAll('[role="option"]'));
        if (options.length === 0) return;

        const currentIndex = options.findIndex(option => option === document.activeElement);
        if (currentIndex === -1) return;

        const activateAt = index => {
          const next = options[index];
          if (!next) return;
          const nextProfileId = next.getAttribute('data-profile-id');
          if (!nextProfileId) return;
          selectProfile(nextProfileId, { focusListItem: true });
        };

        if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
          event.preventDefault();
          activateAt((currentIndex + 1) % options.length);
          return;
        }
        if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
          event.preventDefault();
          activateAt((currentIndex - 1 + options.length) % options.length);
          return;
        }
        if (event.key === 'Home') {
          event.preventDefault();
          activateAt(0);
          return;
        }
        if (event.key === 'End') {
          event.preventDefault();
          activateAt(options.length - 1);
        }
      });
    </script>
  </body>
</html>
