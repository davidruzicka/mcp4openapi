<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style nonce="{{nonce}}">
      :root {
        color-scheme: light;
        --bg: #f6f2ea;
        --bg-accent: #efe7da;
        --ink: #1f1f1f;
        --muted: #615d56;
        --card: #ffffff;
        --accent: #b15a2b;
        --accent-2: #2b5aa3;
        --border: #e1d8cc;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }
      [hidden] { display: none !important; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% -20%, #fbe5d6 0%, transparent 60%),
          radial-gradient(800px 600px at 90% 0%, #dbe9ff 0%, transparent 55%),
          var(--bg);
      }
      header {
        padding: 48px 40px 32px;
      }
      h1 {
        font-size: 36px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      main {
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        gap: 24px;
        padding: 0 40px 48px;
      }
      .panel {
        background: var(--card);
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 24px;
        min-width: 0;
      }
      .profiles {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .profile-item {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--bg-accent);
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .profile-item:focus-visible,
      .tab:focus-visible,
      .copy-btn:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      .profile-item:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .profile-item.active {
        border-color: var(--accent);
        background: #fff5ec;
      }
      .profile-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .profile-subtitle {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .profile-admin-description {
        overflow: visible;
        display: block;
        -webkit-line-clamp: unset;
        white-space: pre-wrap;
      }
      #auth-label {
        margin: 6px 0 0;
      }
      #api-endpoint-env-label {
        margin: 6px 0 12px;
      }
      .detail-grid {
        display: grid;
        gap: 18px;
        min-width: 0;
      }
      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .snippet-format-tabs {
        margin-bottom: 0;
      }
      .tab {
        border: 1px solid var(--border);
        background: #fff;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      .tab.active {
        color: var(--accent);
        border-color: var(--accent);
        background: #fff5ec;
        font-weight: 600;
      }
      .detail-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: #fff;
        min-width: 0;
        max-width: 100%;
      }
      .detail-card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .tag {
        background: #f1efe9;
        color: #2d2b28;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
      }
      code, pre {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px;
        border-radius: 12px;
        max-width: 100%;
        width: 100%;
        overflow-x: auto;
        line-height: 1.6;
      }
      .snippets {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        min-width: 0;
        max-width: 100%;
      }
      .snippet-section-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 2px 0 12px;
        padding: 10px 0 8px;
        border-top: 1px solid var(--border);
        background: #fff;
      }
      .snippet-section-title {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .mode-badge {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: var(--accent);
        background: #fff5ec;
        font-weight: 600;
      }
      .snippet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .snippet-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
        flex-wrap: wrap;
      }
      #snippet-list [data-client-panel] .detail-card {
        overflow-x: auto;
      }
      #snippet-list > [data-client-panel] {
        min-width: 0;
        max-width: 100%;
        width: 100%;
      }
      #snippet-list [data-format-panel-group] {
        min-width: 0;
        max-width: 100%;
      }
      .config-info {
        font-size: 13px;
        color: var(--muted);
        margin: 8px 0 10px;
      }
      kbd {
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 12px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        background: #f7f4ef;
        color: #2d2b28;
      }
      .format-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--muted);
        background: #f7f4ef;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .copy-btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--accent-2);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .notice {
        background: #fff8f1;
        border: 1px solid #f6d5bd;
        padding: 12px;
        border-radius: 12px;
        color: #7a3f1e;
      }
      .tenant-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .tenant-item {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        padding: 10px 12px;
        cursor: pointer;
      }
      .tenant-item.active {
        border-color: var(--accent);
        background: #fff5ec;
      }
      .tenant-title {
        font-size: 13px;
        font-weight: 600;
      }
      .tenant-selector {
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .tenant-mask-note {
        margin-top: 10px;
      }
      .filter-card-stack {
        display: grid;
        gap: 16px;
      }
      .filter-card {
        padding: 0;
      }
      .filter-card summary {
        cursor: pointer;
        list-style: none;
      }
      .filter-card summary::-webkit-details-marker {
        display: none;
      }
      .filter-card summary::marker {
        display: none;
      }
      .filter-card-summary {
        padding: 14px 16px 12px;
      }
      .filter-card-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .filter-card-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .filter-card-body {
        border-top: 1px solid var(--border);
        padding: 14px 16px 16px;
      }
      .filter-preview-line {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        word-break: break-word;
      }
      .filter-control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .filter-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        background: #f7f4ef;
        color: var(--ink);
      }
      .filter-toggle.control {
        background: #fff8f1;
        border-color: #f6d5bd;
        color: #7a3f1e;
      }
      .filter-search {
        margin-top: 12px;
      }
      .filter-search-row {
        display: flex;
        align-items: end;
        gap: 12px;
      }
      .filter-search-field {
        flex: 1 1 auto;
        min-width: 0;
      }
      .filter-search-label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .filter-search-input {
        width: 100%;
      }
      .filter-bulk-toggle {
        flex: 0 0 auto;
        margin-bottom: 1px;
      }
      .filter-bulk-toggle input {
        margin: 0;
      }
      .catalog-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .catalog-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        overflow: hidden;
      }
      .catalog-item summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 14px;
      }
      .catalog-item summary::-webkit-details-marker {
        display: none;
      }
      .catalog-item summary::marker {
        display: none;
      }
      .catalog-summary {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .catalog-summary-text {
        min-width: 0;
      }
      .catalog-title {
        font-weight: 600;
        font-size: 14px;
      }
      .catalog-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .catalog-body {
        border-top: 1px solid var(--border);
        padding: 12px 14px 14px;
      }
      .catalog-nested {
        margin-top: 12px;
      }
      .catalog-nested summary {
        padding: 0;
        font-size: 13px;
        color: var(--accent-2);
      }
      .catalog-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .catalog-chip {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 9px;
        background: #f7f4ef;
        font-size: 12px;
        color: var(--muted);
      }
      .catalog-params {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .param-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }
      .param-row:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .param-meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .param-input {
        width: 100%;
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        background: #fff;
      }
      .filter-empty {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
          padding: 0 20px 40px;
        }
        header {
          padding: 36px 20px 24px;
        }
        .snippet-section-header {
          flex-wrap: wrap;
        }
      }
      .system-notice {
        padding: 14px 40px;
        font-size: 14px;
        font-weight: 500;
        border-bottom: 1px solid transparent;
      }
      .system-notice--info {
        background: #eef3ff;
        border-bottom-color: #93b4f5;
        color: #1e3a7a;
      }
      .system-notice--warning {
        background: #fff8f1;
        border-bottom-color: #f6d5bd;
        color: #7a3f1e;
      }
      .system-notice--error {
        background: #fdf2f2;
        border-bottom-color: #f5c0c0;
        color: #7a1e1e;
      }
      @media (max-width: 700px) {
        .system-notice {
          padding: 12px 20px;
        }
      }
    </style>
  </head>
  <body>
    {{system_notice}}
    <header>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </header>
    <main>
      <section class="panel">
        <h2 class="sr-only">Profiles</h2>
        <div class="profiles" id="profile-list" role="listbox" aria-label="Profiles"></div>
      </section>
      <section class="panel">
        <div class="detail-grid" id="profile-detail">
          <noscript>
            <div class="notice">{{noscript}}</div>
          </noscript>
        </div>
      </section>
    </main>

    <script type="application/json" id="profile-data" nonce="{{nonce}}">{{profile_data}}</script>
    <script type="application/json" id="i18n-data" nonce="{{nonce}}">{{i18n_data}}</script>

    <script nonce="{{nonce}}">
      const profileData = JSON.parse(document.getElementById('profile-data').textContent || '[]');
      const i18n = JSON.parse(document.getElementById('i18n-data').textContent || '{}');

      const listEl = document.getElementById('profile-list');
      const detailEl = document.getElementById('profile-detail');
      const tenantSelectionByProfile = new Map();
      const toolSelectionByProfile = new Map();
      const paramSelectionByProfile = new Map();
      const PROFILE_DEFAULT_TENANT_SELECTION = '__profile-default__';

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTags(items) {
        if (!items || items.length === 0) {
          return `<div class="profile-subtitle">${escapeHtml(i18n.noEnvVars || '')}</div>`;
        }
        const tags = items.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('');
        return `<div class="tag-list">${tags}</div>`;
      }

      function getToolSelection(profileId) {
        let selection = toolSelectionByProfile.get(profileId);
        if (!selection) {
          selection = {
            exactNames: new Set(),
            controlKeys: new Set(),
          };
          toolSelectionByProfile.set(profileId, selection);
        }
        return selection;
      }

      function getParamSelection(profileId) {
        let selection = paramSelectionByProfile.get(profileId);
        if (!selection) {
          selection = {
            values: new Map(),
            controlKeys: new Set(),
          };
          paramSelectionByProfile.set(profileId, selection);
        }
        return selection;
      }

      function serializeToolFilterHeader(profileId) {
        const selection = getToolSelection(profileId);
        const values = [
          ...Array.from(selection.exactNames).sort(),
          ...Array.from(selection.controlKeys).sort(),
        ];
        return values.join(', ');
      }

      function serializeParamFilterHeader(profileId) {
        const selection = getParamSelection(profileId);
        const values = [];
        const names = Array.from(selection.values.keys()).sort();
        for (const name of names) {
          const rawValues = selection.values.get(name) || [];
          const normalizedValues = rawValues
            .map(value => String(value || '').trim())
            .filter(Boolean);
          for (const value of normalizedValues) {
            values.push(`${name}=${encodeURIComponent(value)}`);
          }
        }
        values.push(...Array.from(selection.controlKeys).sort());
        return values.join(', ');
      }

      function serializeLocalToolFilterAllowNames(profileId) {
        const selection = getToolSelection(profileId);
        return Array.from(selection.exactNames).sort().join(',');
      }

      function serializeLocalToolFilterAllowCategories(profileId) {
        const selection = getToolSelection(profileId);
        const categories = [];
        if (selection.controlKeys.has('_allow_list')) {
          categories.push('list');
        }
        if (selection.controlKeys.has('_allow_read')) {
          categories.push('read');
        }
        return categories.join(',');
      }

      function buildLocalCliFilterArgs(profileId) {
        const cliArgs = [];
        const allowNames = serializeLocalToolFilterAllowNames(profileId);
        const allowCategories = serializeLocalToolFilterAllowCategories(profileId);
        const paramFilter = serializeParamFilterHeader(profileId);

        if (allowNames) {
          cliArgs.push('--tool-filter-allow-names', allowNames);
        }
        if (allowCategories) {
          cliArgs.push('--tool-filter-allow-categories', allowCategories);
        }
        if (paramFilter) {
          cliArgs.push('--param-filter', paramFilter);
        }

        return cliArgs;
      }

      function hasActiveToolFilter(profileId) {
        return Boolean(serializeToolFilterHeader(profileId));
      }

      function hasActiveParamFilter(profileId) {
        return Boolean(serializeParamFilterHeader(profileId));
      }

      function setBulkToggleState(toggle, selectedCount, totalCount) {
        if (!(toggle instanceof HTMLInputElement)) return;
        const safeSelectedCount = Math.max(0, Number(selectedCount) || 0);
        const safeTotalCount = Math.max(0, Number(totalCount) || 0);
        const state = safeTotalCount === 0
          ? 'none'
          : safeSelectedCount <= 0
            ? 'none'
            : safeSelectedCount >= safeTotalCount
              ? 'all'
              : 'some';
        toggle.dataset.bulkState = state;
        toggle.disabled = safeTotalCount === 0;
        toggle.checked = state === 'all';
        toggle.indeterminate = state === 'some';
        toggle.setAttribute('aria-checked', state === 'some' ? 'mixed' : (state === 'all' ? 'true' : 'false'));
      }

      function syncSectionBulkToggles(detailEl, profile) {
        if (!(detailEl instanceof HTMLElement) || !profile) return;

        const toolToggle = detailEl.querySelector('[data-tool-section-toggle]');
        if (toolToggle instanceof HTMLInputElement) {
          const toolSelection = getToolSelection(profile.profileId);
          const totalToolFilters = Array.isArray(profile.toolCatalog) ? profile.toolCatalog.length : 0;
          const selectedToolFilters = toolSelection.exactNames.size;
          setBulkToggleState(toolToggle, selectedToolFilters, totalToolFilters);
        }

        const paramToggle = detailEl.querySelector('[data-param-section-toggle]');
        if (paramToggle instanceof HTMLInputElement) {
          const paramSelection = getParamSelection(profile.profileId);
          const totalParamFilters = collectProfileParameters(profile).length;
          const selectedParamFilters = paramSelection.values.size;
          setBulkToggleState(paramToggle, selectedParamFilters, totalParamFilters);
        }
      }

      function collectProfileParameters(profile) {
        const catalog = Array.isArray(profile?.toolCatalog) ? profile.toolCatalog : [];
        const entries = new Map();
        for (const tool of catalog) {
          const toolName = tool?.name || '';
          const parameters = Array.isArray(tool?.parameters) ? tool.parameters : [];
          for (const parameter of parameters) {
            if (!parameter || !parameter.name) continue;
            if (parameter.supportsFilterHeader === false) continue;
            const existing = entries.get(parameter.name);
            if (!existing) {
              entries.set(parameter.name, {
                ...parameter,
                toolNames: toolName ? [toolName] : [],
              });
              continue;
            }
            const toolNames = new Set([...(existing.toolNames || []), ...(toolName ? [toolName] : [])]);
            const requiredFor = new Set([...(existing.requiredFor || []), ...((parameter.requiredFor || []).filter(Boolean))]);
            existing.toolNames = Array.from(toolNames).sort();
            existing.requiredFor = Array.from(requiredFor).sort();
            if (!existing.description && parameter.description) {
              existing.description = parameter.description;
            }
            if (!existing.typeLabel && parameter.typeLabel) {
              existing.typeLabel = parameter.typeLabel;
            }
            if (!existing.defaultValue && parameter.defaultValue) {
              existing.defaultValue = parameter.defaultValue;
            }
            if ((!existing.enumValues || existing.enumValues.length === 0) && Array.isArray(parameter.enumValues)) {
              existing.enumValues = parameter.enumValues;
            }
            existing.required = existing.required || parameter.required;
            existing.isMetadata = existing.isMetadata || parameter.isMetadata;
          }
        }

        return Array.from(entries.values()).sort((left, right) => left.name.localeCompare(right.name));
      }

      function updatePreviewText(element, headerName, value) {
        if (!(element instanceof HTMLElement)) return;
        if (!value) {
          element.innerHTML = '';
          element.setAttribute('hidden', '');
        } else {
          element.innerHTML = `<strong>${escapeHtml(headerName)}</strong>: ${escapeHtml(value)}`;
          element.removeAttribute('hidden');
        }
        const previewCard = element.closest('#filter-preview-card');
        if (previewCard instanceof HTMLElement) {
          const hasVisibleLine = Array.from(previewCard.querySelectorAll('.filter-preview-line'))
            .some(line => line instanceof HTMLElement && !line.hasAttribute('hidden'));
          previewCard.toggleAttribute('hidden', !hasVisibleLine);
        }
      }

      function normalizeFilterQuery(value) {
        return String(value || '').trim().toLowerCase();
      }

      function buildFilterText(parts) {
        return parts
          .flatMap(part => Array.isArray(part) ? part : [part])
          .filter(Boolean)
          .map(part => String(part).toLowerCase())
          .join(' ');
      }

      function wireCollapsibleDetails(root, idPrefix) {
        if (!(root instanceof HTMLElement)) return;
        let counter = 0;
        root.querySelectorAll('details').forEach(details => {
          if (!(details instanceof HTMLDetailsElement)) return;
          const summary = details.querySelector(':scope > summary');
          if (!(summary instanceof HTMLElement)) return;
          const panel = summary.nextElementSibling;
          summary.setAttribute('role', 'button');
          if (panel instanceof HTMLElement) {
            if (!panel.id) {
              counter += 1;
              panel.id = `${idPrefix}-panel-${counter}`;
            }
            summary.setAttribute('aria-controls', panel.id);
          } else {
            summary.removeAttribute('aria-controls');
          }
          const syncState = () => {
            summary.setAttribute('aria-expanded', details.open ? 'true' : 'false');
          };
          syncState();
          details.addEventListener('toggle', syncState);
        });
      }

      function supportsTenantPicker(entry) {
        return Boolean(entry && entry.mode === 'remote' && entry.supportsTenantHeaders);
      }

      function buildMaskExampleBaseUrl(selectorDisplay) {
        if (!selectorDisplay || typeof selectorDisplay !== 'string') return null;
        if (!selectorDisplay.startsWith('mask:')) return null;
        const rawMask = selectorDisplay.slice(5).trim();
        const match = /^(https?:\/\/)([^\/?#]+)([^?#]*)$/.exec(rawMask);
        if (!match) return null;
        const scheme = match[1];
        const hostWithPort = match[2];
        const path = match[3] || '';
        const host = hostWithPort.split(':')[0];
        const portSuffix = hostWithPort.slice(host.length);
        const exampleHost = host
          .split('.')
          .map(label => (label === '*' ? '<your-part>' : label))
          .join('.');
        const examplePath = path
          .split('/')
          .map(segment => (segment === '*' ? '<your-part>' : segment))
          .join('/');
        return `${scheme}${exampleHost}${portSuffix}${examplePath}`;
      }

      function resolveTenantSelection(profile, selectedTenantId) {
        if (!selectedTenantId) return null;
        if (selectedTenantId === PROFILE_DEFAULT_TENANT_SELECTION) return null;
        const tenantList = profile?.tenantSummary?.tenants || [];
        const selectedTenant = tenantList.find(item => item.tenantId === selectedTenantId);
        if (!selectedTenant) return null;
        const localApiBaseUrl = selectedTenant.selectorType === 'mask'
          ? buildMaskExampleBaseUrl(selectedTenant.selectorDisplay)
          : selectedTenant.selectorDisplay;
        return {
          tenantId: selectedTenant.tenantId,
          selectorType: selectedTenant.selectorType,
          selectorDisplay: selectedTenant.selectorDisplay,
          baseUrlExample: selectedTenant.selectorType === 'mask'
            ? buildMaskExampleBaseUrl(selectedTenant.selectorDisplay)
            : null,
          localApiBaseUrl,
        };
      }

      function appendCliArgs(args, additionalArgs) {
        if (!Array.isArray(args) || !Array.isArray(additionalArgs) || additionalArgs.length === 0) {
          return args;
        }
        for (const arg of additionalArgs) {
          args.push(arg);
        }
        return args;
      }

      function escapeCliDoubleQuotedValue(value) {
        return String(value || '')
          .replace(/\\/g, '\\\\')
          .replace(/"/g, '\\"');
      }

      function injectTenantHeaderIntoJsonSnippet(snippet, entry, tenantSelection) {
        let parsed;
        try {
          parsed = JSON.parse(snippet);
        } catch {
          return snippet;
        }

        const key = entry.key || '';
        const root = key.startsWith('vscode-') || key.startsWith('jetbrains-')
          ? parsed.servers
          : parsed.mcpServers;

        if (!root || typeof root !== 'object') return snippet;
        const serverName = Object.keys(root)[0];
        if (!serverName || !root[serverName] || typeof root[serverName] !== 'object') return snippet;
        const server = root[serverName];

        if (key.startsWith('jetbrains-')) {
          if (!server.requestInit || typeof server.requestInit !== 'object') {
            server.requestInit = {};
          }
          if (!server.requestInit.headers || typeof server.requestInit.headers !== 'object') {
            server.requestInit.headers = {};
          }
          server.requestInit.headers['X-Mcp4-Tenant-Id'] = tenantSelection.tenantId;
          if (tenantSelection.baseUrlExample) {
            server.requestInit.headers['X-Mcp4-Api-Base-Url'] = tenantSelection.baseUrlExample;
          }
        } else {
          if (!server.headers || typeof server.headers !== 'object') {
            server.headers = {};
          }
          server.headers['X-Mcp4-Tenant-Id'] = tenantSelection.tenantId;
          if (tenantSelection.baseUrlExample) {
            server.headers['X-Mcp4-Api-Base-Url'] = tenantSelection.baseUrlExample;
          }
        }

        return JSON.stringify(parsed, null, 2);
      }

      function upsertCodexTomlHeader(snippet, headerName, headerValue) {
        const headerEntry = `"${headerName}" = "${headerValue}"`;
        const lines = snippet.split('\n');
        const headersLineIndex = lines.findIndex(line => line.trim().startsWith('http_headers = {'));
        if (headersLineIndex === -1) {
          return `${snippet}\nhttp_headers = { ${headerEntry} }`;
        }

        const line = lines[headersLineIndex];
        const escapedHeaderName = headerName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const existingHeaderRegex = new RegExp(`"${escapedHeaderName}"\\s*=\\s*"[^"]*"`);
        if (existingHeaderRegex.test(line)) {
          lines[headersLineIndex] = line.replace(existingHeaderRegex, headerEntry);
          return lines.join('\n');
        }

        if (/\}\s*$/.test(line)) {
          lines[headersLineIndex] = line.replace(/\}\s*$/, `, ${headerEntry} }`);
          return lines.join('\n');
        }

        return `${snippet}\nhttp_headers = { ${headerEntry} }`;
      }

      function injectTenantHeaderIntoCodexToml(snippet, tenantSelection) {
        let output = upsertCodexTomlHeader(snippet, 'X-Mcp4-Tenant-Id', tenantSelection.tenantId);
        if (tenantSelection.baseUrlExample) {
          output = upsertCodexTomlHeader(output, 'X-Mcp4-Api-Base-Url', tenantSelection.baseUrlExample);
        }
        return output;
      }

      function injectTenantHeaderForSnippet(snippet, entry, tenantSelection) {
        if (!tenantSelection || !supportsTenantPicker(entry)) {
          return snippet;
        }
        const key = entry.key || '';
        if (key.startsWith('codex-toml-')) {
          return injectTenantHeaderIntoCodexToml(snippet, tenantSelection);
        }
        return injectTenantHeaderIntoJsonSnippet(snippet, entry, tenantSelection);
      }

      function injectFilterHeadersIntoJsonSnippet(snippet, entry, toolHeader, paramHeader) {
        let parsed;
        try {
          parsed = JSON.parse(snippet);
        } catch {
          return snippet;
        }

        const key = entry.key || '';
        const root = key.startsWith('vscode-') || key.startsWith('jetbrains-')
          ? parsed.servers
          : parsed.mcpServers;
        if (!root || typeof root !== 'object') return snippet;
        const serverName = Object.keys(root)[0];
        if (!serverName || !root[serverName] || typeof root[serverName] !== 'object') return snippet;
        const server = root[serverName];

        if (key.startsWith('jetbrains-')) {
          if (!server.requestInit || typeof server.requestInit !== 'object') {
            server.requestInit = {};
          }
          if (!server.requestInit.headers || typeof server.requestInit.headers !== 'object') {
            server.requestInit.headers = {};
          }
          if (toolHeader) {
            server.requestInit.headers['X-Mcp4-Tools'] = toolHeader;
          }
          if (paramHeader) {
            server.requestInit.headers['X-Mcp4-Params'] = paramHeader;
          }
        } else {
          if (!server.headers || typeof server.headers !== 'object') {
            server.headers = {};
          }
          if (toolHeader) {
            server.headers['X-Mcp4-Tools'] = toolHeader;
          }
          if (paramHeader) {
            server.headers['X-Mcp4-Params'] = paramHeader;
          }
        }

        return JSON.stringify(parsed, null, 2);
      }

      function injectFilterHeadersIntoCodexToml(snippet, toolHeader, paramHeader) {
        let output = snippet;
        if (toolHeader) {
          output = upsertCodexTomlHeader(output, 'X-Mcp4-Tools', toolHeader);
        }
        if (paramHeader) {
          output = upsertCodexTomlHeader(output, 'X-Mcp4-Params', paramHeader);
        }
        return output;
      }

      function injectFilterHeadersForSnippet(snippet, entry, toolHeader, paramHeader) {
        if (!entry || !entry.supportsCustomHeaders) {
          return snippet;
        }
        if (!toolHeader && !paramHeader) {
          return snippet;
        }
        const key = entry.key || '';
        if (key.startsWith('codex-toml-')) {
          return injectFilterHeadersIntoCodexToml(snippet, toolHeader, paramHeader);
        }
        return injectFilterHeadersIntoJsonSnippet(snippet, entry, toolHeader, paramHeader);
      }

      function injectLocalFilterArgsIntoJsonSnippet(snippet, entry, localCliArgs) {
        if (!Array.isArray(localCliArgs) || localCliArgs.length === 0) {
          return snippet;
        }

        let parsed;
        try {
          parsed = JSON.parse(snippet);
        } catch {
          return snippet;
        }

        const key = entry.key || '';
        const root = key.startsWith('vscode-local-') || key.startsWith('jetbrains-local-')
          ? parsed.servers
          : parsed.mcpServers;
        if (!root || typeof root !== 'object') return snippet;
        const serverName = Object.keys(root)[0];
        if (!serverName || !root[serverName] || typeof root[serverName] !== 'object') return snippet;
        const server = root[serverName];

        if (!Array.isArray(server.args)) {
          return snippet;
        }

        appendCliArgs(server.args, localCliArgs);
        return JSON.stringify(parsed, null, 2);
      }

      function injectLocalFilterArgsIntoCodexToml(snippet, localCliArgs) {
        if (!Array.isArray(localCliArgs) || localCliArgs.length === 0) {
          return snippet;
        }

        const lines = snippet.split('\n');
        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const match = /^(\s*)args\s*=\s*\[(.*)\]\s*$/.exec(line);
          if (!match) continue;
          const indentation = match[1] || '';
          const existingValues = match[2].trim();
          const appendedValues = localCliArgs
            .map(arg => `"${arg.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`)
            .join(', ');
          const combinedValues = existingValues
            ? `${existingValues}, ${appendedValues}`
            : appendedValues;
          lines[index] = `${indentation}args = [${combinedValues}]`;
          return lines.join('\n');
        }

        return snippet;
      }

      function injectLocalFilterArgsIntoCliSnippet(snippet, localCliArgs) {
        if (!Array.isArray(localCliArgs) || localCliArgs.length === 0) {
          return snippet;
        }

        const suffix = localCliArgs
          .map((arg, index) => (index % 2 === 0 ? `${arg}` : `"${escapeCliDoubleQuotedValue(arg)}"`))
          .join(' ');
        return `${snippet} ${suffix}`;
      }

      function injectLocalFilterConfigForSnippet(snippet, entry, profileId) {
        if (!entry || entry.mode !== 'local') {
          return snippet;
        }

        const localCliArgs = buildLocalCliFilterArgs(profileId);
        if (localCliArgs.length === 0) {
          return snippet;
        }

        const key = entry.key || '';
        if (key.startsWith('codex-local-toml-')) {
          return injectLocalFilterArgsIntoCodexToml(snippet, localCliArgs);
        }
        if (entry.format === 'json') {
          return injectLocalFilterArgsIntoJsonSnippet(snippet, entry, localCliArgs);
        }
        if (entry.format === 'cli') {
          return injectLocalFilterArgsIntoCliSnippet(snippet, localCliArgs);
        }

        return snippet;
      }

      function injectTenantApiBaseUrlIntoJsonSnippet(snippet, entry, profile, tenantSelection) {
        const apiBaseUrlEnvVar = profile?.apiEndpointEnvVar;
        const tenantApiBaseUrl = tenantSelection?.localApiBaseUrl;
        if (!apiBaseUrlEnvVar || !tenantApiBaseUrl) return snippet;

        const key = entry?.key || '';
        const isSupportedJsonSnippet = (
          key.startsWith('vscode-local-') ||
          key.startsWith('cursor-local-') ||
          key.startsWith('jetbrains-local-') ||
          key.startsWith('claude-local-json-') ||
          key.startsWith('gemini-local-json-')
        );
        if (!isSupportedJsonSnippet) return snippet;

        let parsed;
        try {
          parsed = JSON.parse(snippet);
        } catch {
          return snippet;
        }

        const root = key.startsWith('vscode-local-') || key.startsWith('jetbrains-local-')
          ? parsed.servers
          : parsed.mcpServers;
        if (!root || typeof root !== 'object') return snippet;
        const serverName = Object.keys(root)[0];
        if (!serverName || !root[serverName] || typeof root[serverName] !== 'object') return snippet;
        const server = root[serverName];
        if (!server.env || typeof server.env !== 'object') {
          server.env = {};
        }
        server.env[apiBaseUrlEnvVar] = tenantApiBaseUrl;

        return JSON.stringify(parsed, null, 2);
      }

      function removeEnvVarFromCodexTomlEnvVars(snippet, envVarName) {
        const lines = snippet.split('\n');
        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          const match = /^(\s*)env_vars\s*=\s*\[(.*)\]\s*$/.exec(line);
          if (!match) continue;
          const indentation = match[1] || '';
          const rawValues = match[2].split(',').map(value => value.trim()).filter(Boolean);
          const filteredValues = rawValues.filter(value => value !== `"${envVarName}"`);
          if (filteredValues.length === 0) {
            lines.splice(index, 1);
            return lines.join('\n');
          }
          lines[index] = `${indentation}env_vars = [${filteredValues.join(', ')}]`;
          return lines.join('\n');
        }
        return lines.join('\n');
      }

      function upsertCodexTomlEnvValue(snippet, profileId, envVarName, envVarValue) {
        const sanitized = removeEnvVarFromCodexTomlEnvVars(snippet, envVarName);
        const lines = sanitized.split('\n');
        const sectionHeaderRegex = /^\[mcp_servers\.[^\]]+\.env\]\s*$/;
        const fallbackSectionHeader = `[mcp_servers.${profileId}.env]`;
        const sectionIndex = lines.findIndex(line => sectionHeaderRegex.test(line.trim()));
        const envEntry = `${envVarName} = "${envVarValue}"`;

        if (sectionIndex === -1) {
          return `${sanitized}\n\n${fallbackSectionHeader}\n${envEntry}`;
        }

        let nextSectionIndex = lines.length;
        for (let index = sectionIndex + 1; index < lines.length; index += 1) {
          if (lines[index].trim().startsWith('[')) {
            nextSectionIndex = index;
            break;
          }
        }

        const escapedEnvVarName = envVarName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const entryRegex = new RegExp(`^\\s*${escapedEnvVarName}\\s*=\\s*\".*\"\\s*$`);
        for (let index = sectionIndex + 1; index < nextSectionIndex; index += 1) {
          if (!entryRegex.test(lines[index])) continue;
          lines[index] = envEntry;
          return lines.join('\n');
        }

        lines.splice(nextSectionIndex, 0, envEntry);
        return lines.join('\n');
      }

      function injectTenantApiBaseUrlIntoCodexToml(snippet, profile, tenantSelection) {
        const apiBaseUrlEnvVar = profile?.apiEndpointEnvVar;
        const tenantApiBaseUrl = tenantSelection?.localApiBaseUrl;
        const profileId = profile?.profileId;
        if (!apiBaseUrlEnvVar || !tenantApiBaseUrl || !profileId) return snippet;
        return upsertCodexTomlEnvValue(snippet, profileId, apiBaseUrlEnvVar, tenantApiBaseUrl);
      }

      function injectTenantApiBaseUrlForLocalSnippet(snippet, entry, profile, tenantSelection) {
        if (!tenantSelection || entry?.mode !== 'local') {
          return snippet;
        }
        const key = entry.key || '';
        if (key.startsWith('codex-local-toml-')) {
          return injectTenantApiBaseUrlIntoCodexToml(snippet, profile, tenantSelection);
        }
        return injectTenantApiBaseUrlIntoJsonSnippet(snippet, entry, profile, tenantSelection);
      }

      function buildSnippet(template, profile, entry, selectedTenantId) {
        const rendered = template
          .replace(/__PROFILE_ID__/g, profile.profileId)
          .replace(/__PROFILE_NAME__/g, profile.profileName)
          .replace(/__PROFILE_URL__/g, profile.mcpUrl)
          .replace(/__PROFILE_SSE_URL__/g, profile.sseUrl);
        const tenantSelection = resolveTenantSelection(profile, selectedTenantId);
        const toolHeader = serializeToolFilterHeader(profile.profileId);
        const paramHeader = serializeParamFilterHeader(profile.profileId);
        const withTenantHeaders = injectTenantHeaderForSnippet(rendered, entry, tenantSelection);
        const withRemoteFilterHeaders = injectFilterHeadersForSnippet(withTenantHeaders, entry, toolHeader, paramHeader);
        const withLocalFilterConfig = injectLocalFilterConfigForSnippet(withRemoteFilterHeaders, entry, profile.profileId);
        return injectTenantApiBaseUrlForLocalSnippet(withLocalFilterConfig, entry, profile, tenantSelection);
      }

      function getClientLabel(client) {
        if (client === 'vscode') return i18n?.snippetLabels?.vscode || 'VS Code + Copilot';
        if (client === 'cursor') return i18n?.snippetLabels?.cursor || 'Cursor';
        if (client === 'jetbrains') return i18n?.snippetLabels?.jetbrains || 'JetBrains IDEs + Copilot';
        if (client === 'claude') return i18n?.snippetLabels?.claude || 'Claude Code';
        if (client === 'gemini') return i18n?.snippetLabels?.gemini || 'Gemini CLI';
        if (client === 'codex') return i18n?.snippetLabels?.codex || 'Codex';
        return client;
      }

      function renderSnippets(profile, activeAuth, activeMode, selectedTenantId) {
        const order = ['vscode', 'cursor', 'jetbrains', 'claude', 'gemini', 'codex'];
        const snippets = profile.snippets || [];
        const groups = new Map();
        const isCzech = (i18n.profileLabel || '') === 'Profil';
        const selectedTenant = resolveTenantSelection(profile, selectedTenantId);
        const hasActiveFiltering = hasActiveToolFilter(profile.profileId) || hasActiveParamFilter(profile.profileId);

        const buildClientConfigInfo = client => {
          if (client === 'vscode') {
            return isCzech
              ? 'Otevři command palette pomocí <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), vyhledej <strong>MCP</strong> a zvol <code>MCP: Open User Configuration</code>.'
              : 'Open command palette with <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), search for <strong>MCP</strong>, then choose <code>MCP: Open User Configuration</code>.';
          }
          if (client === 'cursor') {
            return isCzech
              ? 'Otevři command palette pomocí <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), vyhledej <strong>MCP</strong>, otevři <code>View: Open MCP Settings</code> a dole klikni na <code>New MCP Server</code>.'
              : 'Open command palette with <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), search for <strong>MCP</strong>, open <code>View: Open MCP Settings</code>, then click <code>New MCP Server</code>.';
          }
          if (client === 'jetbrains') {
            return isCzech
              ? 'Otevři akce přes <kbd>Ctrl+Shift+A</kbd> (Mac: <kbd>Cmd+Shift+A</kbd>), vyhledej <strong>MCP</strong>, otevři <code>Model Context Protocol (MCP)</code> a klikni na <code>Configure</code>.'
              : 'Open actions with <kbd>Ctrl+Shift+A</kbd> (Mac: <kbd>Cmd+Shift+A</kbd>), search for <strong>MCP</strong>, open <code>Model Context Protocol (MCP)</code>, then click <code>Configure</code>.';
          }
          if (client === 'claude') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.claude.json</code>.'
              : 'User (global) configuration is in <code>~/.claude.json</code>.';
          }
          if (client === 'codex') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.codex/config.toml</code>.'
              : 'User (global) configuration is in <code>~/.codex/config.toml</code>.';
          }
          if (client === 'gemini') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.gemini/settings.json</code>.'
              : 'User (global) configuration is in <code>~/.gemini/settings.json</code>.';
          }
          return '';
        };

        for (const entry of snippets) {
          if (!entry || !entry.key) continue;
          if (activeAuth && entry.authKey && entry.authKey !== activeAuth) continue;
          if (activeMode && entry.mode && entry.mode !== activeMode) continue;
          if (hasActiveFiltering && activeMode === 'remote' && !entry.supportsCustomHeaders) {
            continue;
          }
          if (selectedTenant && activeMode === 'remote' && profile.tenantSummary?.tenantsEnabled && !entry.supportsTenantHeaders) {
            continue;
          }
          const client = order.find(prefix => entry.key.startsWith(prefix));
          if (!client) continue;
          const existing = groups.get(client) || [];
          existing.push(entry);
          groups.set(client, existing);
        }

        const clientTabs = [];
        const clientPanels = [];
        let cardIndex = 0;
        for (const client of order) {
          const entries = groups.get(client);
          if (!entries || entries.length === 0) continue;

          const title = getClientLabel(client);
          const formatOrder = ['toml', 'json', 'cli'];
          entries.sort((a, b) => {
            const left = formatOrder.indexOf(a.format || '');
            const right = formatOrder.indexOf(b.format || '');
            return (left === -1 ? 99 : left) - (right === -1 ? 99 : right);
          });

          const groupId = `snippet-format-${client}-${cardIndex}`;
          cardIndex += 1;
          const clientTabId = `snippet-client-tab-${client}-${cardIndex}`;
          const clientPanelId = `snippet-client-panel-${client}-${cardIndex}`;
          const isClientActive = clientTabs.length === 0;
          const hasFormatTabs = entries.length > 1;
          const tabsHtml = `
            <div class="tab-row snippet-format-tabs" role="tablist" aria-label="Snippet format">
              ${entries.map((entry, index) => `
                <button
                  class="tab${index === 0 ? ' active' : ''}"
                  type="button"
                  role="tab"
                  aria-selected="${index === 0 ? 'true' : 'false'}"
                  tabindex="${index === 0 ? '0' : '-1'}"
                  data-format-group="${escapeHtml(groupId)}"
                  data-format-tab="${escapeHtml(entry.format || `format-${index}`)}"
                >
                  ${escapeHtml((entry.format || 'text').toUpperCase())}
                </button>
              `).join('')}
            </div>
          `;

          const panelHtml = entries.map((entry, index) => {
            const format = entry.format || '';
            const snippet = buildSnippet(entry.content, profile, entry, selectedTenantId);
            const encodedSnippet = encodeURIComponent(snippet);
            const hiddenAttr = hasFormatTabs && index > 0 ? ' hidden' : '';
            return `
              <div data-format-panel-group="${escapeHtml(groupId)}" data-format-panel="${escapeHtml(format || `format-${index}`)}" data-copy="${encodedSnippet}"${hiddenAttr}>
                <pre><code>${escapeHtml(snippet)}</code></pre>
              </div>
            `;
          }).join('');

          const firstSnippet = buildSnippet(entries[0].content, profile, entries[0], selectedTenantId);
          const firstEncodedSnippet = encodeURIComponent(firstSnippet);
          const configInfo = buildClientConfigInfo(client);

          clientTabs.push(`
            <button
              class="tab${isClientActive ? ' active' : ''}"
              type="button"
              role="tab"
              id="${escapeHtml(clientTabId)}"
              aria-selected="${isClientActive ? 'true' : 'false'}"
              tabindex="${isClientActive ? '0' : '-1'}"
              aria-controls="${escapeHtml(clientPanelId)}"
              data-client-tab="${escapeHtml(client)}"
            >
              ${escapeHtml(title)}
            </button>
          `);

          clientPanels.push(`
            <div
              id="${escapeHtml(clientPanelId)}"
              role="tabpanel"
              aria-labelledby="${escapeHtml(clientTabId)}"
              data-client-panel="${escapeHtml(client)}"
              ${isClientActive ? '' : 'hidden'}
            >
              <div class="detail-card">
                <div class="snippet-header">
                  <h3>${escapeHtml(title)}</h3>
                  <div class="snippet-meta">
                    ${tabsHtml}
                    <button class="copy-btn" data-copy="${firstEncodedSnippet}" data-copy-group="${escapeHtml(groupId)}">${escapeHtml(i18n.copy || '')}</button>
                  </div>
                </div>
                ${configInfo ? `<div class="config-info">${configInfo}</div>` : ''}
                ${panelHtml}
              </div>
            </div>
          `);
        }
        if (clientTabs.length === 0) {
          if (hasActiveFiltering && activeMode === 'remote') {
            return `
              <div class="notice">
                ${escapeHtml(isCzech
                  ? 'Pri aktivnim filtrovani zustavaji dostupne jen konfigurace s podporou vlastnich HTTP hlavicek.'
                  : 'When filtering is active, only configurations with custom HTTP header support remain available.')}
              </div>
            `;
          }
          return '';
        }
        return `
          <div class="tab-row" id="client-tabs" role="tablist" aria-label="Client tools">
            ${clientTabs.join('')}
          </div>
          ${clientPanels.join('')}
        `;
      }

      function wireClientTabs(snippetList) {
        if (!snippetList) return;
        if (snippetList.dataset.clientTabsWired === '1') return;
        snippetList.dataset.clientTabsWired = '1';

        const activateClientTab = clientKey => {
          const tabs = Array.from(snippetList.querySelectorAll('[data-client-tab]'));
          tabs.forEach(tab => {
            const isActive = tab.getAttribute('data-client-tab') === clientKey;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
            tab.setAttribute('tabindex', isActive ? '0' : '-1');
          });

          const panels = Array.from(snippetList.querySelectorAll('[data-client-panel]'));
          panels.forEach(panel => {
            const isActive = panel.getAttribute('data-client-panel') === clientKey;
            if (isActive) {
              panel.removeAttribute('hidden');
            } else {
              panel.setAttribute('hidden', '');
            }
          });
        };

        snippetList.addEventListener('click', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const clientKey = target.getAttribute('data-client-tab');
          if (!clientKey) return;
          activateClientTab(clientKey);
        });

        snippetList.addEventListener('keydown', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const clientKey = target.getAttribute('data-client-tab');
          if (!clientKey) return;

          const tabs = Array.from(snippetList.querySelectorAll('[data-client-tab]'));
          if (tabs.length === 0) return;
          const currentIndex = tabs.findIndex(tab => tab === target);
          if (currentIndex === -1) return;

          const focusAt = index => {
            const nextTab = tabs[index];
            if (!nextTab) return;
            nextTab.focus();
            const nextClient = nextTab.getAttribute('data-client-tab');
            if (!nextClient) return;
            activateClientTab(nextClient);
          };

          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusAt((currentIndex + 1) % tabs.length);
            return;
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusAt((currentIndex - 1 + tabs.length) % tabs.length);
            return;
          }
          if (event.key === 'Home') {
            event.preventDefault();
            focusAt(0);
            return;
          }
          if (event.key === 'End') {
            event.preventDefault();
            focusAt(tabs.length - 1);
          }
        });
      }

      function wireSnippetFormatTabs(snippetList) {
        if (!snippetList) return;
        if (snippetList.dataset.formatTabsWired === '1') return;
        snippetList.dataset.formatTabsWired = '1';

        const activateFormat = (groupId, formatKey) => {
          const tabs = Array.from(snippetList.querySelectorAll(`[data-format-group="${groupId}"]`));
          tabs.forEach(tab => {
            const isActive = tab.getAttribute('data-format-tab') === formatKey;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
            tab.setAttribute('tabindex', isActive ? '0' : '-1');
          });

          const panels = Array.from(snippetList.querySelectorAll(`[data-format-panel-group="${groupId}"]`));
          let activeCopyPayload = '';
          panels.forEach(panel => {
            const isActive = panel.getAttribute('data-format-panel') === formatKey;
            if (isActive) {
              panel.removeAttribute('hidden');
              activeCopyPayload = panel.getAttribute('data-copy') || '';
            } else {
              panel.setAttribute('hidden', '');
            }
          });
          const groupCopyButton = snippetList.querySelector(`[data-copy-group="${groupId}"]`);
          if (groupCopyButton instanceof HTMLElement && activeCopyPayload) {
            groupCopyButton.setAttribute('data-copy', activeCopyPayload);
          }
        };

        snippetList.addEventListener('click', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const groupId = target.getAttribute('data-format-group');
          const formatKey = target.getAttribute('data-format-tab');
          if (!groupId || !formatKey) return;
          activateFormat(groupId, formatKey);
        });

        snippetList.addEventListener('keydown', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const groupId = target.getAttribute('data-format-group');
          const formatKey = target.getAttribute('data-format-tab');
          if (!groupId || !formatKey) return;

          const tabs = Array.from(snippetList.querySelectorAll(`[data-format-group="${groupId}"]`));
          if (tabs.length === 0) return;
          const currentIndex = tabs.findIndex(tab => tab === target);
          if (currentIndex === -1) return;

          const focusAt = index => {
            const nextTab = tabs[index];
            if (!nextTab) return;
            nextTab.focus();
            const nextFormat = nextTab.getAttribute('data-format-tab');
            if (!nextFormat) return;
            activateFormat(groupId, nextFormat);
          };

          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusAt((currentIndex + 1) % tabs.length);
            return;
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusAt((currentIndex - 1 + tabs.length) % tabs.length);
            return;
          }
          if (event.key === 'Home') {
            event.preventDefault();
            focusAt(0);
            return;
          }
          if (event.key === 'End') {
            event.preventDefault();
            focusAt(tabs.length - 1);
          }
        });
      }

      function buildProfileTitle(profile) {
        const parts = [profile.profileId, profile.profileName, ...(profile.profileAliases || [])];
        const seen = new Set();
        const unique = [];
        for (const part of parts) {
          if (!part) continue;
          const key = String(part);
          if (seen.has(key)) continue;
          seen.add(key);
          unique.push(key);
        }
        if (unique.length === 0) return '';
        if (unique.length === 1) return unique[0];
        return `${unique[0]} (${unique.slice(1).join(', ')})`;
      }
