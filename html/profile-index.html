<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style nonce="{{nonce}}">
      :root {
        color-scheme: light;
        --bg: #f6f2ea;
        --bg-accent: #efe7da;
        --ink: #1f1f1f;
        --muted: #615d56;
        --card: #ffffff;
        --accent: #b15a2b;
        --accent-2: #2b5aa3;
        --border: #e1d8cc;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% -20%, #fbe5d6 0%, transparent 60%),
          radial-gradient(800px 600px at 90% 0%, #dbe9ff 0%, transparent 55%),
          var(--bg);
      }
      header {
        padding: 48px 40px 32px;
      }
      h1 {
        font-size: 36px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      main {
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        gap: 24px;
        padding: 0 40px 48px;
      }
      .panel {
        background: var(--card);
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 24px;
        min-width: 0;
      }
      .profiles {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .profile-item {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--bg-accent);
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .profile-item:focus-visible,
      .tab:focus-visible,
      .copy-btn:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      .profile-item:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .profile-item.active {
        border-color: var(--accent);
        background: #fff5ec;
      }
      .profile-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .profile-subtitle {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #auth-label {
        margin: 6px 0 0;
      }
      #api-endpoint-env-label {
        margin: 6px 0 12px;
      }
      .detail-grid {
        display: grid;
        gap: 18px;
        min-width: 0;
      }
      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .snippet-format-tabs {
        margin-bottom: 0;
      }
      .tab {
        border: 1px solid var(--border);
        background: #fff;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      .tab.active {
        color: var(--accent);
        border-color: var(--accent);
        background: #fff5ec;
        font-weight: 600;
      }
      .detail-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: #fff;
        min-width: 0;
        max-width: 100%;
      }
      .detail-card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .tag {
        background: #f1efe9;
        color: #2d2b28;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
      }
      code, pre {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px;
        border-radius: 12px;
        max-width: 100%;
        width: 100%;
        overflow-x: auto;
        line-height: 1.6;
      }
      .snippets {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        min-width: 0;
        max-width: 100%;
      }
      .snippet-section-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 2px 0 12px;
        padding: 10px 0 8px;
        border-top: 1px solid var(--border);
        background: #fff;
      }
      .snippet-section-title {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .mode-badge {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: var(--accent);
        background: #fff5ec;
        font-weight: 600;
      }
      .snippet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .snippet-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
        flex-wrap: wrap;
      }
      #snippet-list [data-client-panel] .detail-card {
        overflow-x: auto;
      }
      #snippet-list > [data-client-panel] {
        min-width: 0;
        max-width: 100%;
        width: 100%;
      }
      #snippet-list [data-format-panel-group] {
        min-width: 0;
        max-width: 100%;
      }
      .config-info {
        font-size: 13px;
        color: var(--muted);
        margin: 8px 0 10px;
      }
      kbd {
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 12px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        background: #f7f4ef;
        color: #2d2b28;
      }
      .format-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--muted);
        background: #f7f4ef;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .copy-btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--accent-2);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .notice {
        background: #fff8f1;
        border: 1px solid #f6d5bd;
        padding: 12px;
        border-radius: 12px;
        color: #7a3f1e;
      }
      .tenant-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .tenant-item {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        padding: 10px 12px;
        cursor: pointer;
      }
      .tenant-item.active {
        border-color: var(--accent);
        background: #fff5ec;
      }
      .tenant-title {
        font-size: 13px;
        font-weight: 600;
      }
      .tenant-selector {
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
          padding: 0 20px 40px;
        }
        header {
          padding: 36px 20px 24px;
        }
        .snippet-section-header {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </header>
    <main>
      <section class="panel">
        <h2 class="sr-only">Profiles</h2>
        <div class="profiles" id="profile-list" role="listbox" aria-label="Profiles"></div>
      </section>
      <section class="panel">
        <div class="detail-grid" id="profile-detail">
          <noscript>
            <div class="notice">{{noscript}}</div>
          </noscript>
        </div>
      </section>
    </main>

    <script type="application/json" id="profile-data" nonce="{{nonce}}">{{profile_data}}</script>
    <script type="application/json" id="i18n-data" nonce="{{nonce}}">{{i18n_data}}</script>

    <script nonce="{{nonce}}">
      const profileData = JSON.parse(document.getElementById('profile-data').textContent || '[]');
      const i18n = JSON.parse(document.getElementById('i18n-data').textContent || '{}');

      const listEl = document.getElementById('profile-list');
      const detailEl = document.getElementById('profile-detail');
      const tenantSelectionByProfile = new Map();

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTags(items) {
        if (!items || items.length === 0) {
          return `<div class="profile-subtitle">${escapeHtml(i18n.noEnvVars || '')}</div>`;
        }
        const tags = items.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('');
        return `<div class="tag-list">${tags}</div>`;
      }

      function supportsTenantPicker(entry) {
        if (!entry || entry.mode !== 'remote') return false;
        const key = entry.key || '';
        return (
          key.startsWith('vscode-') ||
          key.startsWith('jetbrains-') ||
          key.startsWith('claude-json-') ||
          key.startsWith('gemini-json-') ||
          key.startsWith('codex-toml-')
        );
      }

      function buildMaskExampleBaseUrl(selectorDisplay) {
        if (!selectorDisplay || typeof selectorDisplay !== 'string') return null;
        if (!selectorDisplay.startsWith('mask:')) return null;
        const rawMask = selectorDisplay.slice(5).trim();
        const match = /^(https?:\/\/)([^\/?#]+)([^?#]*)$/.exec(rawMask);
        if (!match) return null;
        const scheme = match[1];
        const hostWithPort = match[2];
        const path = match[3] || '';
        const host = hostWithPort.split(':')[0];
        const portSuffix = hostWithPort.slice(host.length);
        const exampleHost = host
          .split('.')
          .map(label => (label === '*' ? '<your-part>' : label))
          .join('.');
        return `${scheme}${exampleHost}${portSuffix}${path}`;
      }

      function resolveTenantSelection(profile, selectedTenantId) {
        if (!selectedTenantId) return null;
        const tenantList = profile?.tenantSummary?.tenants || [];
        const selectedTenant = tenantList.find(item => item.tenantId === selectedTenantId);
        if (!selectedTenant) return null;
        return {
          tenantId: selectedTenant.tenantId,
          selectorType: selectedTenant.selectorType,
          selectorDisplay: selectedTenant.selectorDisplay,
          baseUrlExample: selectedTenant.selectorType === 'mask'
            ? buildMaskExampleBaseUrl(selectedTenant.selectorDisplay)
            : null,
        };
      }

      function injectTenantHeaderIntoJsonSnippet(snippet, entry, tenantSelection) {
        let parsed;
        try {
          parsed = JSON.parse(snippet);
        } catch {
          return snippet;
        }

        const key = entry.key || '';
        const root = key.startsWith('vscode-') || key.startsWith('jetbrains-')
          ? parsed.servers
          : parsed.mcpServers;

        if (!root || typeof root !== 'object') return snippet;
        const serverName = Object.keys(root)[0];
        if (!serverName || !root[serverName] || typeof root[serverName] !== 'object') return snippet;
        const server = root[serverName];

        if (key.startsWith('jetbrains-')) {
          if (!server.requestInit || typeof server.requestInit !== 'object') {
            server.requestInit = {};
          }
          if (!server.requestInit.headers || typeof server.requestInit.headers !== 'object') {
            server.requestInit.headers = {};
          }
          server.requestInit.headers['X-Mcp4-Tenant-Id'] = tenantSelection.tenantId;
          if (tenantSelection.baseUrlExample) {
            server.requestInit.headers['X-Mcp4-Api-Base-Url'] = tenantSelection.baseUrlExample;
          }
        } else {
          if (!server.headers || typeof server.headers !== 'object') {
            server.headers = {};
          }
          server.headers['X-Mcp4-Tenant-Id'] = tenantSelection.tenantId;
          if (tenantSelection.baseUrlExample) {
            server.headers['X-Mcp4-Api-Base-Url'] = tenantSelection.baseUrlExample;
          }
        }

        return JSON.stringify(parsed, null, 2);
      }

      function upsertCodexTomlHeader(snippet, headerName, headerValue) {
        const headerEntry = `"${headerName}" = "${headerValue}"`;
        const lines = snippet.split('\n');
        const headersLineIndex = lines.findIndex(line => line.trim().startsWith('http_headers = {'));
        if (headersLineIndex === -1) {
          return `${snippet}\nhttp_headers = { ${headerEntry} }`;
        }

        const line = lines[headersLineIndex];
        const escapedHeaderName = headerName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const existingHeaderRegex = new RegExp(`"${escapedHeaderName}"\\s*=\\s*"[^"]*"`);
        if (existingHeaderRegex.test(line)) {
          lines[headersLineIndex] = line.replace(existingHeaderRegex, headerEntry);
          return lines.join('\n');
        }

        if (/\}\s*$/.test(line)) {
          lines[headersLineIndex] = line.replace(/\}\s*$/, `, ${headerEntry} }`);
          return lines.join('\n');
        }

        return `${snippet}\nhttp_headers = { ${headerEntry} }`;
      }

      function injectTenantHeaderIntoCodexToml(snippet, tenantSelection) {
        let output = upsertCodexTomlHeader(snippet, 'X-Mcp4-Tenant-Id', tenantSelection.tenantId);
        if (tenantSelection.baseUrlExample) {
          output = upsertCodexTomlHeader(output, 'X-Mcp4-Api-Base-Url', tenantSelection.baseUrlExample);
        }
        return output;
      }

      function injectTenantHeaderForSnippet(snippet, entry, tenantSelection) {
        if (!tenantSelection || !supportsTenantPicker(entry)) {
          return snippet;
        }
        const key = entry.key || '';
        if (key.startsWith('codex-toml-')) {
          return injectTenantHeaderIntoCodexToml(snippet, tenantSelection);
        }
        return injectTenantHeaderIntoJsonSnippet(snippet, entry, tenantSelection);
      }

      function buildSnippet(template, profile, entry, selectedTenantId) {
        const rendered = template
          .replace(/__PROFILE_ID__/g, profile.profileId)
          .replace(/__PROFILE_NAME__/g, profile.profileName)
          .replace(/__PROFILE_URL__/g, profile.mcpUrl)
          .replace(/__PROFILE_SSE_URL__/g, profile.sseUrl);
        const tenantSelection = resolveTenantSelection(profile, selectedTenantId);
        return injectTenantHeaderForSnippet(rendered, entry, tenantSelection);
      }

      function getClientLabel(client) {
        if (client === 'vscode') return i18n?.snippetLabels?.vscode || 'VS Code + Copilot';
        if (client === 'cursor') return i18n?.snippetLabels?.cursor || 'Cursor';
        if (client === 'jetbrains') return i18n?.snippetLabels?.jetbrains || 'JetBrains IDEs + Copilot';
        if (client === 'claude') return i18n?.snippetLabels?.claude || 'Claude Code';
        if (client === 'gemini') return i18n?.snippetLabels?.gemini || 'Gemini CLI';
        if (client === 'codex') return i18n?.snippetLabels?.codex || 'Codex';
        return client;
      }

      function renderSnippets(profile, activeAuth, activeMode, selectedTenantId) {
        const order = ['vscode', 'cursor', 'jetbrains', 'claude', 'gemini', 'codex'];
        const snippets = profile.snippets || [];
        const groups = new Map();
        const isCzech = (i18n.profileLabel || '') === 'Profil';

        const buildClientConfigInfo = client => {
          if (client === 'vscode') {
            return isCzech
              ? 'Otevři command palette pomocí <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), vyhledej <strong>MCP</strong> a zvol <code>MCP: Open User Configuration</code>.'
              : 'Open command palette with <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), search for <strong>MCP</strong>, then choose <code>MCP: Open User Configuration</code>.';
          }
          if (client === 'cursor') {
            return isCzech
              ? 'Otevři command palette pomocí <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), vyhledej <strong>MCP</strong>, otevři <code>View: Open MCP Settings</code> a dole klikni na <code>New MCP Server</code>.'
              : 'Open command palette with <kbd>Ctrl+Shift+P</kbd> (Mac: <kbd>Cmd+Shift+P</kbd>), search for <strong>MCP</strong>, open <code>View: Open MCP Settings</code>, then click <code>New MCP Server</code>.';
          }
          if (client === 'jetbrains') {
            return isCzech
              ? 'Otevři akce přes <kbd>Ctrl+Shift+A</kbd> (Mac: <kbd>Cmd+Shift+A</kbd>), vyhledej <strong>MCP</strong>, otevři <code>Model Context Protocol (MCP)</code> a klikni na <code>Configure</code>.'
              : 'Open actions with <kbd>Ctrl+Shift+A</kbd> (Mac: <kbd>Cmd+Shift+A</kbd>), search for <strong>MCP</strong>, open <code>Model Context Protocol (MCP)</code>, then click <code>Configure</code>.';
          }
          if (client === 'claude') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.claude.json</code>.'
              : 'User (global) configuration is in <code>~/.claude.json</code>.';
          }
          if (client === 'codex') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.codex/config.toml</code>.'
              : 'User (global) configuration is in <code>~/.codex/config.toml</code>.';
          }
          if (client === 'gemini') {
            return isCzech
              ? 'Uživatelská (globální) konfigurace je v <code>~/.gemini/settings.json</code>.'
              : 'User (global) configuration is in <code>~/.gemini/settings.json</code>.';
          }
          return '';
        };

        for (const entry of snippets) {
          if (!entry || !entry.key) continue;
          if (activeAuth && entry.authKey && entry.authKey !== activeAuth) continue;
          if (activeMode && entry.mode && entry.mode !== activeMode) continue;
          if (selectedTenantId && activeMode === 'remote' && profile.tenantSummary?.tenantsEnabled && !supportsTenantPicker(entry)) {
            continue;
          }
          const client = order.find(prefix => entry.key.startsWith(prefix));
          if (!client) continue;
          const existing = groups.get(client) || [];
          existing.push(entry);
          groups.set(client, existing);
        }

        const clientTabs = [];
        const clientPanels = [];
        let cardIndex = 0;
        for (const client of order) {
          const entries = groups.get(client);
          if (!entries || entries.length === 0) continue;

          const title = getClientLabel(client);
          const formatOrder = ['toml', 'json', 'cli'];
          entries.sort((a, b) => {
            const left = formatOrder.indexOf(a.format || '');
            const right = formatOrder.indexOf(b.format || '');
            return (left === -1 ? 99 : left) - (right === -1 ? 99 : right);
          });

          const groupId = `snippet-format-${client}-${cardIndex}`;
          cardIndex += 1;
          const clientTabId = `snippet-client-tab-${client}-${cardIndex}`;
          const clientPanelId = `snippet-client-panel-${client}-${cardIndex}`;
          const isClientActive = clientTabs.length === 0;
          const hasFormatTabs = entries.length > 1;
          const tabsHtml = `
            <div class="tab-row snippet-format-tabs" role="tablist" aria-label="Snippet format">
              ${entries.map((entry, index) => `
                <button
                  class="tab${index === 0 ? ' active' : ''}"
                  type="button"
                  role="tab"
                  aria-selected="${index === 0 ? 'true' : 'false'}"
                  tabindex="${index === 0 ? '0' : '-1'}"
                  data-format-group="${escapeHtml(groupId)}"
                  data-format-tab="${escapeHtml(entry.format || `format-${index}`)}"
                >
                  ${escapeHtml((entry.format || 'text').toUpperCase())}
                </button>
              `).join('')}
            </div>
          `;

          const panelHtml = entries.map((entry, index) => {
            const format = entry.format || '';
            const snippet = buildSnippet(entry.content, profile, entry, selectedTenantId);
            const encodedSnippet = encodeURIComponent(snippet);
            const hiddenAttr = hasFormatTabs && index > 0 ? ' hidden' : '';
            return `
              <div data-format-panel-group="${escapeHtml(groupId)}" data-format-panel="${escapeHtml(format || `format-${index}`)}" data-copy="${encodedSnippet}"${hiddenAttr}>
                <pre><code>${escapeHtml(snippet)}</code></pre>
              </div>
            `;
          }).join('');

          const firstSnippet = buildSnippet(entries[0].content, profile, entries[0], selectedTenantId);
          const firstEncodedSnippet = encodeURIComponent(firstSnippet);
          const configInfo = buildClientConfigInfo(client);

          clientTabs.push(`
            <button
              class="tab${isClientActive ? ' active' : ''}"
              type="button"
              role="tab"
              id="${escapeHtml(clientTabId)}"
              aria-selected="${isClientActive ? 'true' : 'false'}"
              tabindex="${isClientActive ? '0' : '-1'}"
              aria-controls="${escapeHtml(clientPanelId)}"
              data-client-tab="${escapeHtml(client)}"
            >
              ${escapeHtml(title)}
            </button>
          `);

          clientPanels.push(`
            <div
              id="${escapeHtml(clientPanelId)}"
              role="tabpanel"
              aria-labelledby="${escapeHtml(clientTabId)}"
              data-client-panel="${escapeHtml(client)}"
              ${isClientActive ? '' : 'hidden'}
            >
              <div class="detail-card">
                <div class="snippet-header">
                  <h3>${escapeHtml(title)}</h3>
                  <div class="snippet-meta">
                    ${tabsHtml}
                    <button class="copy-btn" data-copy="${firstEncodedSnippet}" data-copy-group="${escapeHtml(groupId)}">${escapeHtml(i18n.copy || '')}</button>
                  </div>
                </div>
                ${configInfo ? `<div class="config-info">${configInfo}</div>` : ''}
                ${panelHtml}
              </div>
            </div>
          `);
        }
        if (clientTabs.length === 0) {
          return '';
        }
        return `
          <div class="tab-row" id="client-tabs" role="tablist" aria-label="Client tools">
            ${clientTabs.join('')}
          </div>
          ${clientPanels.join('')}
        `;
      }

      function wireClientTabs(snippetList) {
        if (!snippetList) return;
        if (snippetList.dataset.clientTabsWired === '1') return;
        snippetList.dataset.clientTabsWired = '1';

        const activateClientTab = clientKey => {
          const tabs = Array.from(snippetList.querySelectorAll('[data-client-tab]'));
          tabs.forEach(tab => {
            const isActive = tab.getAttribute('data-client-tab') === clientKey;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
            tab.setAttribute('tabindex', isActive ? '0' : '-1');
          });

          const panels = Array.from(snippetList.querySelectorAll('[data-client-panel]'));
          panels.forEach(panel => {
            const isActive = panel.getAttribute('data-client-panel') === clientKey;
            if (isActive) {
              panel.removeAttribute('hidden');
            } else {
              panel.setAttribute('hidden', '');
            }
          });
        };

        snippetList.addEventListener('click', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const clientKey = target.getAttribute('data-client-tab');
          if (!clientKey) return;
          activateClientTab(clientKey);
        });

        snippetList.addEventListener('keydown', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const clientKey = target.getAttribute('data-client-tab');
          if (!clientKey) return;

          const tabs = Array.from(snippetList.querySelectorAll('[data-client-tab]'));
          if (tabs.length === 0) return;
          const currentIndex = tabs.findIndex(tab => tab === target);
          if (currentIndex === -1) return;

          const focusAt = index => {
            const nextTab = tabs[index];
            if (!nextTab) return;
            nextTab.focus();
            const nextClient = nextTab.getAttribute('data-client-tab');
            if (!nextClient) return;
            activateClientTab(nextClient);
          };

          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusAt((currentIndex + 1) % tabs.length);
            return;
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusAt((currentIndex - 1 + tabs.length) % tabs.length);
            return;
          }
          if (event.key === 'Home') {
            event.preventDefault();
            focusAt(0);
            return;
          }
          if (event.key === 'End') {
            event.preventDefault();
            focusAt(tabs.length - 1);
          }
        });
      }

      function wireSnippetFormatTabs(snippetList) {
        if (!snippetList) return;
        if (snippetList.dataset.formatTabsWired === '1') return;
        snippetList.dataset.formatTabsWired = '1';

        const activateFormat = (groupId, formatKey) => {
          const tabs = Array.from(snippetList.querySelectorAll(`[data-format-group="${groupId}"]`));
          tabs.forEach(tab => {
            const isActive = tab.getAttribute('data-format-tab') === formatKey;
            tab.classList.toggle('active', isActive);
            tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
            tab.setAttribute('tabindex', isActive ? '0' : '-1');
          });

          const panels = Array.from(snippetList.querySelectorAll(`[data-format-panel-group="${groupId}"]`));
          let activeCopyPayload = '';
          panels.forEach(panel => {
            const isActive = panel.getAttribute('data-format-panel') === formatKey;
            if (isActive) {
              panel.removeAttribute('hidden');
              activeCopyPayload = panel.getAttribute('data-copy') || '';
            } else {
              panel.setAttribute('hidden', '');
            }
          });
          const groupCopyButton = snippetList.querySelector(`[data-copy-group="${groupId}"]`);
          if (groupCopyButton instanceof HTMLElement && activeCopyPayload) {
            groupCopyButton.setAttribute('data-copy', activeCopyPayload);
          }
        };

        snippetList.addEventListener('click', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const groupId = target.getAttribute('data-format-group');
          const formatKey = target.getAttribute('data-format-tab');
          if (!groupId || !formatKey) return;
          activateFormat(groupId, formatKey);
        });

        snippetList.addEventListener('keydown', event => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const groupId = target.getAttribute('data-format-group');
          const formatKey = target.getAttribute('data-format-tab');
          if (!groupId || !formatKey) return;

          const tabs = Array.from(snippetList.querySelectorAll(`[data-format-group="${groupId}"]`));
          if (tabs.length === 0) return;
          const currentIndex = tabs.findIndex(tab => tab === target);
          if (currentIndex === -1) return;

          const focusAt = index => {
            const nextTab = tabs[index];
            if (!nextTab) return;
            nextTab.focus();
            const nextFormat = nextTab.getAttribute('data-format-tab');
            if (!nextFormat) return;
            activateFormat(groupId, nextFormat);
          };

          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusAt((currentIndex + 1) % tabs.length);
            return;
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusAt((currentIndex - 1 + tabs.length) % tabs.length);
            return;
          }
          if (event.key === 'Home') {
            event.preventDefault();
            focusAt(0);
            return;
          }
          if (event.key === 'End') {
            event.preventDefault();
            focusAt(tabs.length - 1);
          }
        });
      }

      function buildProfileTitle(profile) {
        const parts = [profile.profileId, profile.profileName, ...(profile.profileAliases || [])];
        const seen = new Set();
        const unique = [];
        for (const part of parts) {
          if (!part) continue;
          const key = String(part);
          if (seen.has(key)) continue;
          seen.add(key);
          unique.push(key);
        }
        if (unique.length === 0) return '';
        if (unique.length === 1) return unique[0];
        return `${unique[0]} (${unique.slice(1).join(', ')})`;
      }

      function renderDetail(profile) {
        const title = buildProfileTitle(profile);
        const description = profile.description || i18n.noDescription || '';
        const authTabs = profile.authTabs || [];
        const activeAuth = authTabs.length > 0 ? authTabs[0].key : null;
        const modeTabs = profile.modeTabs || [];
        const activeMode = modeTabs.length > 0 ? modeTabs[0].key : 'remote';
        const isCzech = (i18n.profileLabel || '') === 'Profil';
        const snippetSectionLabel = isCzech ? 'Konfigurace klientů' : 'Client configuration snippets';
        const getModeLabel = modeKey => modeTabs.find(tab => tab.key === modeKey)?.label || modeKey;
        const tenantSummary = profile.tenantSummary;
        const tenantList = tenantSummary && tenantSummary.tenantsEnabled ? (tenantSummary.tenants || []) : [];
        const persistedTenantId = tenantSelectionByProfile.get(profile.profileId);
        const defaultTenant = tenantList.find(item => item.isDefault) || tenantList[0];
        const initialTenantId = (persistedTenantId && tenantList.some(item => item.tenantId === persistedTenantId))
          ? persistedTenantId
          : (defaultTenant ? defaultTenant.tenantId : null);
        if (initialTenantId) {
          tenantSelectionByProfile.set(profile.profileId, initialTenantId);
        }
        const authEnvVars = Array.from(
          new Set((profile.authMethods || [])
            .map(method => method && method.valueFromEnv)
            .filter(Boolean))
        );
        const authEnvText = authEnvVars.length > 0
          ? `${i18n.authEnvVarsLabel || 'Environment variable:'} ${authEnvVars.join(', ')}`
          : (i18n.authEnvVarsNone || 'No environment variable required');
        const apiEndpointEnvVar = profile.apiEndpointEnvVar || '';
        let apiEndpointValueText = `${i18n.apiEndpointUnavailableInline || 'is not configured'}`;
        if (profile.apiEndpointDefaultValue) {
          apiEndpointValueText = profile.apiEndpointDefaultValue;
        }
        const apiEndpointHtml = `<p><strong>${escapeHtml(i18n.apiEndpointLabel || 'API endpoint')}</strong>: ${escapeHtml(apiEndpointValueText)}</p>`;
        const apiEndpointEnvText = apiEndpointEnvVar
          ? `${i18n.authEnvVarsLabel || 'Environment variable:'} ${apiEndpointEnvVar}`
          : '';
        const tenantCardHtml = tenantList.length > 0
          ? `
            <div class="detail-card">
              <h3>${escapeHtml(i18n.tenantSectionLabel || 'Tenants')}</h3>
              <p><strong>${escapeHtml(i18n.tenantsAvailableLabel || 'Available tenants')}</strong>: ${tenantList.length}</p>
              <p><strong>${escapeHtml(i18n.tenantHeaderLabel || 'Selection header')}</strong>: ${escapeHtml(tenantSummary.selectionHeaderName || 'X-Mcp4-Tenant-Id')}</p>
              <p class="profile-subtitle">${escapeHtml(i18n.tenantPickerScopeLabel || '')}</p>
              <div class="tenant-list" id="tenant-tabs" role="tablist" aria-label="Tenants">
                ${tenantList.map(item => {
                  const isActive = item.tenantId === initialTenantId;
                  const defaultLabel = item.isDefault ? ` (${i18n.tenantDefaultLabel || 'default'})` : '';
                  return `
                    <button
                      class="tenant-item${isActive ? ' active' : ''}"
                      type="button"
                      role="tab"
                      aria-selected="${isActive ? 'true' : 'false'}"
                      tabindex="${isActive ? '0' : '-1'}"
                      data-tenant-id="${escapeHtml(item.tenantId)}"
                    >
                      <div class="tenant-title">${escapeHtml(item.tenantId)}${escapeHtml(defaultLabel)}</div>
                      <div class="tenant-selector">${escapeHtml(i18n.tenantSelectorLabel || 'Selector')}: ${escapeHtml(item.selectorDisplay)}</div>
                    </button>
                  `;
                }).join('')}
              </div>
              ${tenantList.some(item => item.selectorType === 'mask') ? `<p class="profile-subtitle">${escapeHtml(i18n.tenantMaskNote || '')}</p>` : ''}
            </div>
          `
          : '';
        detailEl.innerHTML = `
          <div class="detail-card">
            <h3>${escapeHtml(i18n.profileLabel || '')}</h3>
            <div class="profile-title">${escapeHtml(title)}</div>
            <div class="profile-subtitle">${escapeHtml(description)}</div>
          </div>
          <div class="detail-card">
            <h3>${escapeHtml(i18n.endpointLabel || '')}</h3>
            <p><strong>MCP</strong>: ${escapeHtml(profile.mcpUrl)}</p>
            <p><strong>SSE</strong> ${escapeHtml(i18n.sseDeprecatedLabel || '(deprecated)')}: ${escapeHtml(profile.sseUrl)}</p>
            ${apiEndpointHtml}
          </div>
          ${tenantCardHtml}
          <div class="detail-card">
            <div class="tab-row" id="mode-tabs" role="tablist" aria-label="Connection mode">
              ${modeTabs.map(tab => `
                <button
                  class="tab${tab.key === activeMode ? ' active' : ''}"
                  data-mode="${escapeHtml(tab.key)}"
                  role="tab"
                  aria-selected="${tab.key === activeMode ? 'true' : 'false'}"
                  tabindex="${tab.key === activeMode ? '0' : '-1'}"
                >
                  ${escapeHtml(tab.label)}
                </button>
              `).join('')}
            </div>
            <p class="profile-subtitle" id="auth-label">
              <strong>${escapeHtml(i18n.authSectionLabel || 'Authentication:')}</strong>
              ${escapeHtml(authEnvText)}
            </p>
            <p class="profile-subtitle" id="api-endpoint-env-label" style="display:none;">
              <strong>${escapeHtml(i18n.apiEndpointLabel || 'API endpoint')}:</strong>
              ${escapeHtml(apiEndpointEnvText)}
            </p>
            <div class="tab-row" id="auth-tabs" role="tablist" aria-label="Authentication methods">
              ${authTabs.map(tab => `
                <button
                  class="tab${tab.key === activeAuth ? ' active' : ''}"
                  id="auth-tab-${escapeHtml(tab.key)}"
                  data-auth="${escapeHtml(tab.key)}"
                  role="tab"
                  aria-selected="${tab.key === activeAuth ? 'true' : 'false'}"
                  tabindex="${tab.key === activeAuth ? '0' : '-1'}"
                >
                  ${escapeHtml(tab.label)}
                </button>
              `).join('')}
            </div>
            <div class="snippet-section-header">
              <span class="snippet-section-title">${escapeHtml(snippetSectionLabel)}</span>
              <span class="mode-badge" id="active-mode-badge">${escapeHtml(getModeLabel(activeMode))}</span>
            </div>
            <div class="snippets" id="snippet-list" role="tabpanel" aria-live="polite">
              ${renderSnippets(profile, activeAuth, activeMode, initialTenantId)}
            </div>
          </div>
        `;

        const modeRow = detailEl.querySelector('#mode-tabs');
        const authLabel = detailEl.querySelector('#auth-label');
        const apiEndpointEnvLabel = detailEl.querySelector('#api-endpoint-env-label');
        const tabRow = detailEl.querySelector('#auth-tabs');
        const modeBadge = detailEl.querySelector('#active-mode-badge');
        const snippetList = detailEl.querySelector('#snippet-list');
        const tenantRow = detailEl.querySelector('#tenant-tabs');
        if (modeRow && authLabel && tabRow && snippetList) {
          let currentMode = activeMode;
          let currentTenantId = initialTenantId;

          const setActiveMode = modeKey => {
            currentMode = modeKey;
            modeRow.querySelectorAll('.tab').forEach(tab => {
              const isActive = tab.getAttribute('data-mode') === modeKey;
              tab.classList.toggle('active', isActive);
              tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
              tab.setAttribute('tabindex', isActive ? '0' : '-1');
            });
            const showAuthTabs = modeKey !== 'local';
            const showAuthLabel = modeKey === 'local';
            tabRow.style.display = showAuthTabs ? '' : 'none';
            authLabel.style.display = showAuthLabel ? '' : 'none';
            if (modeBadge instanceof HTMLElement) {
              modeBadge.textContent = getModeLabel(modeKey);
            }
            if (apiEndpointEnvLabel) {
              const showApiEndpointEnvLabel = modeKey === 'local' && !!apiEndpointEnvText;
              apiEndpointEnvLabel.style.display = showApiEndpointEnvLabel ? '' : 'none';
            }
            const currentAuth = (tabRow.querySelector('.tab.active') || tabRow.querySelector('.tab'))?.getAttribute('data-auth');
            snippetList.innerHTML = renderSnippets(profile, currentAuth, currentMode, currentTenantId);
            wireClientTabs(snippetList);
            wireSnippetFormatTabs(snippetList);
          };

          const setActiveTab = authKey => {
            let activeTabId = null;
            tabRow.querySelectorAll('.tab').forEach(tab => {
              const isActive = tab.getAttribute('data-auth') === authKey;
              tab.classList.toggle('active', isActive);
              tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
              tab.setAttribute('tabindex', isActive ? '0' : '-1');
              if (isActive) {
                  activeTabId = tab.id || null;
                }
              });
            snippetList.innerHTML = renderSnippets(profile, authKey, currentMode, currentTenantId);
            wireClientTabs(snippetList);
            wireSnippetFormatTabs(snippetList);
            if (activeTabId) {
              snippetList.setAttribute('aria-labelledby', activeTabId);
            } else {
              snippetList.removeAttribute('aria-labelledby');
            }
          };

          const setActiveTenant = tenantId => {
            currentTenantId = tenantId;
            tenantSelectionByProfile.set(profile.profileId, tenantId);
            if (tenantRow) {
              tenantRow.querySelectorAll('[data-tenant-id]').forEach(tab => {
                const isActive = tab.getAttribute('data-tenant-id') === tenantId;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
                tab.setAttribute('tabindex', isActive ? '0' : '-1');
              });
            }
            const currentAuth = (tabRow.querySelector('.tab.active') || tabRow.querySelector('.tab'))?.getAttribute('data-auth');
            snippetList.innerHTML = renderSnippets(profile, currentAuth, currentMode, currentTenantId);
            wireClientTabs(snippetList);
            wireSnippetFormatTabs(snippetList);
          };

          modeRow.addEventListener('click', event => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const modeKey = target.getAttribute('data-mode');
            if (!modeKey) return;
            setActiveMode(modeKey);
          });

          modeRow.addEventListener('keydown', event => {
            const tabs = Array.from(modeRow.querySelectorAll('[role="tab"]'));
            if (tabs.length === 0) return;

            const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
            if (currentIndex === -1) return;

            const focusModeTabAt = index => {
              const nextTab = tabs[index];
              if (!nextTab) return;
              nextTab.focus();
              const modeKey = nextTab.getAttribute('data-mode');
              if (modeKey) setActiveMode(modeKey);
            };

            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
              event.preventDefault();
              focusModeTabAt((currentIndex + 1) % tabs.length);
              return;
            }
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
              event.preventDefault();
              focusModeTabAt((currentIndex - 1 + tabs.length) % tabs.length);
              return;
            }
            if (event.key === 'Home') {
              event.preventDefault();
              focusModeTabAt(0);
              return;
            }
            if (event.key === 'End') {
              event.preventDefault();
              focusModeTabAt(tabs.length - 1);
            }
          });

          tabRow.addEventListener('click', event => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const authKey = target.getAttribute('data-auth');
            if (!authKey) return;
            setActiveTab(authKey);
          });

          tabRow.addEventListener('keydown', event => {
            const tabs = Array.from(tabRow.querySelectorAll('[role="tab"]'));
            if (tabs.length === 0) return;

            const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
            if (currentIndex === -1) return;

            const focusTabAt = index => {
              const nextTab = tabs[index];
              if (!nextTab) return;
              nextTab.focus();
              const authKey = nextTab.getAttribute('data-auth');
              if (authKey) setActiveTab(authKey);
            };

            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
              event.preventDefault();
              focusTabAt((currentIndex + 1) % tabs.length);
              return;
            }
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
              event.preventDefault();
              focusTabAt((currentIndex - 1 + tabs.length) % tabs.length);
              return;
            }
            if (event.key === 'Home') {
              event.preventDefault();
              focusTabAt(0);
              return;
            }
            if (event.key === 'End') {
              event.preventDefault();
              focusTabAt(tabs.length - 1);
            }
          });

          if (tenantRow) {
            tenantRow.addEventListener('click', event => {
              const target = event.target;
              if (!(target instanceof HTMLElement)) return;
              const tenantButton = target.closest('[data-tenant-id]');
              if (!(tenantButton instanceof HTMLElement)) return;
              const tenantId = tenantButton.getAttribute('data-tenant-id');
              if (!tenantId) return;
              setActiveTenant(tenantId);
            });

            tenantRow.addEventListener('keydown', event => {
              const tabs = Array.from(tenantRow.querySelectorAll('[role="tab"]'));
              if (tabs.length === 0) return;

              const currentIndex = tabs.findIndex(tab => tab === document.activeElement);
              if (currentIndex === -1) return;

              const focusTabAt = index => {
                const nextTab = tabs[index];
                if (!nextTab) return;
                nextTab.focus();
                const tenantId = nextTab.getAttribute('data-tenant-id');
                if (tenantId) setActiveTenant(tenantId);
              };

              if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                event.preventDefault();
                focusTabAt((currentIndex + 1) % tabs.length);
                return;
              }
              if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                event.preventDefault();
                focusTabAt((currentIndex - 1 + tabs.length) % tabs.length);
                return;
              }
              if (event.key === 'Home') {
                event.preventDefault();
                focusTabAt(0);
                return;
              }
              if (event.key === 'End') {
                event.preventDefault();
                focusTabAt(tabs.length - 1);
              }
            });
          }

          const initialActiveTab = tabRow.querySelector('.tab.active');
          if (initialActiveTab && initialActiveTab.id) {
            snippetList.setAttribute('aria-labelledby', initialActiveTab.id);
          }
          setActiveMode(currentMode);
        }
      }

      function renderList(activeId, options) {
        const opts = options || {};
        listEl.innerHTML = '';
        profileData.forEach(profile => {
          const title = buildProfileTitle(profile);
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'profile-item' + (profile.profileId === activeId ? ' active' : '');
          item.setAttribute('role', 'option');
          item.setAttribute('aria-selected', profile.profileId === activeId ? 'true' : 'false');
          item.setAttribute('tabindex', profile.profileId === activeId ? '0' : '-1');
          item.setAttribute('data-profile-id', profile.profileId);
          item.id = `profile-option-${profile.profileId}`;
          item.innerHTML = `
            <div class="profile-title">${escapeHtml(title)}</div>
            <div class="profile-subtitle">${escapeHtml(profile.description || i18n.noDescription || '')}</div>
          `;
          item.addEventListener('click', () => {
            selectProfile(profile.profileId, { focusListItem: true });
          });
          listEl.appendChild(item);
        });

        if (opts.focusSelected) {
          const selected = Array.from(listEl.querySelectorAll('[data-profile-id]'))
            .find(node => node.getAttribute('data-profile-id') === activeId);
          if (selected instanceof HTMLElement) {
            selected.focus();
          }
        }
      }

      function selectProfile(profileId, options) {
        const profile = profileData.find(item => item.profileId === profileId);
        if (!profile) return;
        renderList(profileId, { focusSelected: !!(options && options.focusListItem) });
        renderDetail(profile);
      }

      if (profileData.length > 0) {
        selectProfile(profileData[0].profileId);
      } else {
        detailEl.innerHTML = `<div class="notice">${escapeHtml(i18n.noProfiles || '')}</div>`;
      }

      document.addEventListener('click', event => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.matches('[data-copy]')) return;
        const text = target.getAttribute('data-copy');
        if (!text) return;
        const decoded = decodeURIComponent(text);
        navigator.clipboard?.writeText(decoded).then(() => {
          target.textContent = i18n.copied || '';
          setTimeout(() => { target.textContent = i18n.copy || ''; }, 1200);
        }).catch(() => {
          target.textContent = i18n.copyFailed || '';
          setTimeout(() => { target.textContent = i18n.copy || ''; }, 1200);
        });
      });

      listEl.addEventListener('keydown', event => {
        const options = Array.from(listEl.querySelectorAll('[role="option"]'));
        if (options.length === 0) return;

        const currentIndex = options.findIndex(option => option === document.activeElement);
        if (currentIndex === -1) return;

        const activateAt = index => {
          const next = options[index];
          if (!next) return;
          const nextProfileId = next.getAttribute('data-profile-id');
          if (!nextProfileId) return;
          selectProfile(nextProfileId, { focusListItem: true });
        };

        if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
          event.preventDefault();
          activateAt((currentIndex + 1) % options.length);
          return;
        }
        if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
          event.preventDefault();
          activateAt((currentIndex - 1 + options.length) % options.length);
          return;
        }
        if (event.key === 'Home') {
          event.preventDefault();
          activateAt(0);
          return;
        }
        if (event.key === 'End') {
          event.preventDefault();
          activateAt(options.length - 1);
        }
      });
    </script>
  </body>
</html>
